<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img" aria-label="Animated packet flow across three partitions, each with two exits and a redundant gateway pair attached to both; spines, leaves and machines are summarised as the fabric. A tenant packet arrives from partition A's fabric over VXLAN with VNI 3981 via exit-a1 at gw-a1, which provisioned the tenant VRF. gw-a1 encapsulates it in SRv6 to partition B's anycast SID and sends it in the DCI network (VNI 104100) via the other exit, exit-a2, into the IPv6-only core. exit-b1 delivers it to gw-b2, which decapsulates it (End.DT46) and forwards it with partition B's VNI 4011 via exit-b2 into partition B's fabric. Partition C works alike.">
<style>
  text { font-family: ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
  .scene { font-size: 13px; font-weight: 600; }
  .part { fill: #f6f8fa; stroke: #d0d7de; }
  .plabel { font-size: 12px; font-weight: 600; fill: #59636e; }
  .link { stroke: #8c959f; stroke-width: 2; }
  .node { fill: #ffffff; stroke: #59636e; stroke-width: 1.5; }
  .gw { fill: #fff1e5; stroke: #bc4c00; stroke-width: 2; }
  .fab { fill: none; stroke: #8c959f; stroke-width: 1.5; stroke-dasharray: 5 4; }
  .nl { font-size: 12px; font-weight: 600; }
  .ns { font-size: 10px; fill: #59636e; }
  .h { stroke: rgba(0,0,0,.25); }
  .ip { fill: #dafbe1; } .vx { fill: #ddf4ff; } .dci { fill: #eddeff; } .sr { fill: #ffe2cc; }
  .ht { font-size: 10.5px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .cap { font-size: 13px; }
  .pkt { fill: #bc4c00; }
  @media (prefers-color-scheme: dark) {
    text { fill: #e6edf3; }
    .part { fill: #161b22; stroke: #3d444d; }
    .plabel, .ns { fill: #9198a1; }
    .link { stroke: #656c76; }
    .fab { stroke: #656c76; }
    .node { fill: #0d1117; stroke: #9198a1; }
    .gw { fill: #3d1d00; stroke: #f0883e; }
    .h { stroke: rgba(255,255,255,.2); }
    .ht { fill: #0d1117; }
    .pkt { fill: #f0883e; }
  }
</style>
<rect class="part" x="8" y="160" width="304" height="236" rx="10"/><text class="plabel" x="160" y="386" text-anchor="middle">Partition A · locator fd00:dc1:a::/48 · DCI network</text>
<rect class="fab" x="30" y="332" width="260" height="26" rx="6"/><text class="ns" x="160" y="349" text-anchor="middle">fabric: spines, leaves, machines</text>
<rect class="part" x="328" y="160" width="304" height="236" rx="10"/><text class="plabel" x="480" y="386" text-anchor="middle">Partition B · locator fd00:dc1:b::/48 · underlay</text>
<rect class="fab" x="350" y="332" width="260" height="26" rx="6"/><text class="ns" x="480" y="349" text-anchor="middle">fabric: spines, leaves, machines</text>
<rect class="part" x="648" y="160" width="304" height="236" rx="10"/><text class="plabel" x="800" y="386" text-anchor="middle">Partition C · locator fd00:dc1:c::/48 · underlay</text>
<rect class="fab" x="670" y="332" width="260" height="26" rx="6"/><text class="ns" x="800" y="349" text-anchor="middle">fabric: spines, leaves, machines</text>
<line class="link" x1="480" y1="130" x2="60" y2="205"/>
<line class="link" x1="60" y1="205" x2="60" y2="345"/>
<line class="link" x1="60" y1="205" x2="120" y2="280"/>
<line class="link" x1="60" y1="205" x2="200" y2="280"/>
<line class="link" x1="480" y1="130" x2="260" y2="205"/>
<line class="link" x1="260" y1="205" x2="260" y2="345"/>
<line class="link" x1="260" y1="205" x2="120" y2="280"/>
<line class="link" x1="260" y1="205" x2="200" y2="280"/>
<line class="link" x1="480" y1="130" x2="380" y2="205"/>
<line class="link" x1="380" y1="205" x2="380" y2="345"/>
<line class="link" x1="380" y1="205" x2="440" y2="280"/>
<line class="link" x1="380" y1="205" x2="520" y2="280"/>
<line class="link" x1="480" y1="130" x2="580" y2="205"/>
<line class="link" x1="580" y1="205" x2="580" y2="345"/>
<line class="link" x1="580" y1="205" x2="440" y2="280"/>
<line class="link" x1="580" y1="205" x2="520" y2="280"/>
<line class="link" x1="480" y1="130" x2="700" y2="205"/>
<line class="link" x1="700" y1="205" x2="700" y2="345"/>
<line class="link" x1="700" y1="205" x2="760" y2="280"/>
<line class="link" x1="700" y1="205" x2="840" y2="280"/>
<line class="link" x1="480" y1="130" x2="900" y2="205"/>
<line class="link" x1="900" y1="205" x2="900" y2="345"/>
<line class="link" x1="900" y1="205" x2="760" y2="280"/>
<line class="link" x1="900" y1="205" x2="840" y2="280"/>
<rect class="node" x="445.0" y="115.0" width="70" height="30" rx="6"/><text class="nl" x="480" y="134" text-anchor="middle">core</text>
<text class="ns" x="480" y="157" text-anchor="middle">IPv6 only</text>
<rect class="node" x="25.0" y="190.0" width="70" height="30" rx="6"/><text class="nl" x="60" y="209" text-anchor="middle">exit-a1</text>
<rect class="node" x="225.0" y="190.0" width="70" height="30" rx="6"/><text class="nl" x="260" y="209" text-anchor="middle">exit-a2</text>
<rect class="node gw" x="85.0" y="265.0" width="70" height="30" rx="6"/><text class="nl" x="120" y="284" text-anchor="middle">gw-a1</text>
<rect class="node gw" x="165.0" y="265.0" width="70" height="30" rx="6"/><text class="nl" x="200" y="284" text-anchor="middle">gw-a2</text>
<rect class="node" x="345.0" y="190.0" width="70" height="30" rx="6"/><text class="nl" x="380" y="209" text-anchor="middle">exit-b1</text>
<rect class="node" x="545.0" y="190.0" width="70" height="30" rx="6"/><text class="nl" x="580" y="209" text-anchor="middle">exit-b2</text>
<rect class="node gw" x="405.0" y="265.0" width="70" height="30" rx="6"/><text class="nl" x="440" y="284" text-anchor="middle">gw-b1</text>
<rect class="node gw" x="485.0" y="265.0" width="70" height="30" rx="6"/><text class="nl" x="520" y="284" text-anchor="middle">gw-b2</text>
<rect class="node" x="665.0" y="190.0" width="70" height="30" rx="6"/><text class="nl" x="700" y="209" text-anchor="middle">exit-c1</text>
<rect class="node" x="865.0" y="190.0" width="70" height="30" rx="6"/><text class="nl" x="900" y="209" text-anchor="middle">exit-c2</text>
<rect class="node gw" x="725.0" y="265.0" width="70" height="30" rx="6"/><text class="nl" x="760" y="284" text-anchor="middle">gw-c1</text>
<rect class="node gw" x="805.0" y="265.0" width="70" height="30" rx="6"/><text class="nl" x="840" y="284" text-anchor="middle">gw-c2</text>
<text class="scene" x="480" y="26" text-anchor="middle">Tenant VRFs stitched by redundant gateway pairs, dual-attached to two exits</text>
<g opacity="1"><animate attributeName="opacity" dur="13.2s" repeatCount="indefinite" calcMode="discrete" values="1;0" keyTimes="0;0.1818"/><rect class="h ip" x="345" y="80" width="270" height="16" rx="3"/><text class="ht" x="480" y="92" text-anchor="middle">IPv4  10.0.16.10 → 10.0.32.10</text><rect class="h vx" x="345" y="62" width="270" height="16" rx="3"/><text class="ht" x="480" y="74" text-anchor="middle">VXLAN  VNI 3981 (tenant 1, A)</text></g>
<g opacity="0"><animate attributeName="opacity" dur="13.2s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.1818;0.3636"/><rect class="h ip" x="345" y="80" width="270" height="16" rx="3"/><text class="ht" x="480" y="92" text-anchor="middle">IPv4  10.0.16.10 → 10.0.32.10</text><rect class="h sr" x="345" y="62" width="270" height="16" rx="3"/><text class="ht" x="480" y="74" text-anchor="middle">SRv6  → fd00:dc1:b:fab:: (End.DT46)</text><rect class="h dci" x="345" y="44" width="270" height="16" rx="3"/><text class="ht" x="480" y="56" text-anchor="middle">VXLAN  VNI 104100 (DCI network)</text></g>
<g opacity="0"><animate attributeName="opacity" dur="13.2s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.3636;0.5455"/><rect class="h ip" x="345" y="80" width="270" height="16" rx="3"/><text class="ht" x="480" y="92" text-anchor="middle">IPv4  10.0.16.10 → 10.0.32.10</text><rect class="h sr" x="345" y="62" width="270" height="16" rx="3"/><text class="ht" x="480" y="74" text-anchor="middle">SRv6  → fd00:dc1:b:fab::</text></g>
<g opacity="0"><animate attributeName="opacity" dur="13.2s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.5455;0.7273"/><rect class="h ip" x="345" y="80" width="270" height="16" rx="3"/><text class="ht" x="480" y="92" text-anchor="middle">IPv4  10.0.16.10 → 10.0.32.10</text><rect class="h sr" x="345" y="62" width="270" height="16" rx="3"/><text class="ht" x="480" y="74" text-anchor="middle">SRv6  → fd00:dc1:b:fab::</text></g>
<g opacity="0"><animate attributeName="opacity" dur="13.2s" repeatCount="indefinite" calcMode="discrete" values="0;1" keyTimes="0;0.7273"/><rect class="h ip" x="345" y="80" width="270" height="16" rx="3"/><text class="ht" x="480" y="92" text-anchor="middle">IPv4  10.0.16.10 → 10.0.32.10</text><rect class="h vx" x="345" y="62" width="270" height="16" rx="3"/><text class="ht" x="480" y="74" text-anchor="middle">VXLAN  VNI 4011 (tenant 1, B)</text></g>
<g><animateTransform attributeName="transform" type="translate" dur="13.2s" repeatCount="indefinite" values="60 319;60 179;120 254;120 254;120 254;260 179;260 179;260 179;480 104;380 179;380 179;380 179;520 254;520 254;520 254;580 179;580 319;580 319" keyTimes="0.0000;0.0584;0.0985;0.1818;0.1818;0.2803;0.3636;0.3636;0.4277;0.4621;0.5455;0.5455;0.6439;0.7273;0.7273;0.7673;0.8258;1.0000"/><circle class="pkt" cx="0" cy="0" r="6"/></g>
<g opacity="1"><animate attributeName="opacity" dur="13.2s" repeatCount="indefinite" calcMode="discrete" values="1;0" keyTimes="0;0.1818"/><text class="cap" x="480" y="425" text-anchor="middle"><tspan font-weight="600">1/5  fabric A → gw-a1:</tspan> EVPN type-5 via either exit to either gateway (ECMP): both are VTEPs of VNI 3981.</text></g>
<g opacity="0"><animate attributeName="opacity" dur="13.2s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.1818;0.3636"/><text class="cap" x="480" y="425" text-anchor="middle"><tspan font-weight="600">2/5  gw-a1 → exit-a2:</tspan> SRv6 to B's anycast SID, in the DCI network via the gateway's other exit.</text></g>
<g opacity="0"><animate attributeName="opacity" dur="13.2s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.3636;0.5455"/><text class="cap" x="480" y="425" text-anchor="middle"><tspan font-weight="600">3/5  exit-a2 → exit-b1:</tspan> Between partitions only IPv6: locators, no tenants, no VNIs. C works alike.</text></g>
<g opacity="0"><animate attributeName="opacity" dur="13.2s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.5455;0.7273"/><text class="cap" x="480" y="425" text-anchor="middle"><tspan font-weight="600">4/5  exit-b1 → gw-b2:</tspan> Both gateways own the SID; a gateway or an exit can fail without BGP changes.</text></g>
<g opacity="0"><animate attributeName="opacity" dur="13.2s" repeatCount="indefinite" calcMode="discrete" values="0;1" keyTimes="0;0.7273"/><text class="cap" x="480" y="425" text-anchor="middle"><tspan font-weight="600">5/5  gw-b2 → fabric B:</tspan> End.DT46 into the tenant VRF, type-5 with B's own VNI 4011. Tenants never see SIDs.</text></g>
</svg>
