<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" role="img" aria-label="Animated packet flow: a tenant packet from m-a travels over VXLAN with VNI 3981 through partition A's fabric to the gateway gw-a, whose tenant VRF open-dci provisioned. gw-a encapsulates it in SRv6 and sends it in the DCI network (VNI 104100) back to the exit, as plain IPv6 through the core and partition B's underlay to gw-b, which decapsulates it (End.DT46) and forwards it with partition B's VNI 4011 via leaf-b to m-b.">
<style>
  text { font-family: ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
  .scene { font-size: 13px; font-weight: 600; }
  .part { fill: #f6f8fa; stroke: #d0d7de; }
  .plabel { font-size: 12px; font-weight: 600; fill: #59636e; }
  .link { stroke: #8c959f; stroke-width: 2; }
  .node { fill: #ffffff; stroke: #59636e; stroke-width: 1.5; }
  .gw { fill: #fff1e5; stroke: #bc4c00; stroke-width: 2; }
  .nl { font-size: 12px; font-weight: 600; }
  .ns { font-size: 10px; fill: #59636e; }
  .h { stroke: rgba(0,0,0,.25); }
  .ip { fill: #dafbe1; } .vx { fill: #ddf4ff; } .dci { fill: #eddeff; } .sr { fill: #ffe2cc; }
  .ht { font-size: 10.5px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .cap { font-size: 13px; }
  .pkt { fill: #bc4c00; }
  @media (prefers-color-scheme: dark) {
    text { fill: #e6edf3; }
    .part { fill: #161b22; stroke: #3d444d; }
    .plabel, .ns { fill: #9198a1; }
    .link { stroke: #656c76; }
    .node { fill: #0d1117; stroke: #9198a1; }
    .gw { fill: #3d1d00; stroke: #f0883e; }
    .h { stroke: rgba(255,255,255,.2); }
    .ht { fill: #0d1117; }
    .pkt { fill: #f0883e; }
  }
</style>
<rect class="part" x="8" y="104" width="400" height="190" rx="10"/><text class="plabel" x="20" y="124">Partition A · EVPN domain A</text>
<rect class="part" x="552" y="104" width="400" height="190" rx="10"/><text class="plabel" x="940" y="124" text-anchor="end">Partition B · EVPN domain B</text>
<line class="link" x1="46" y1="186" x2="160" y2="186"/>
<line class="link" x1="160" y1="186" x2="330" y2="186"/>
<line class="link" x1="330" y1="186" x2="330" y2="252"/>
<line class="link" x1="330" y1="186" x2="480" y2="186"/>
<line class="link" x1="480" y1="186" x2="630" y2="186"/>
<line class="link" x1="630" y1="186" x2="630" y2="252"/>
<line class="link" x1="630" y1="186" x2="800" y2="186"/>
<line class="link" x1="800" y1="186" x2="914" y2="186"/>
<rect class="node" x="14.0" y="171.0" width="64" height="30" rx="6"/><text class="nl" x="46" y="190" text-anchor="middle">m-a</text>
<text class="ns" x="46" y="213" text-anchor="middle">tenant 1</text>
<rect class="node" x="125.0" y="171.0" width="70" height="30" rx="6"/><text class="nl" x="160" y="190" text-anchor="middle">leaf-a</text>
<rect class="node" x="295.0" y="171.0" width="70" height="30" rx="6"/><text class="nl" x="330" y="190" text-anchor="middle">exit-a</text>
<rect class="node gw" x="295.0" y="237.0" width="70" height="30" rx="6"/><text class="nl" x="330" y="256" text-anchor="middle">gw-a</text>
<text class="ns" x="372" y="250" text-anchor="start">gateway</text><text class="ns" x="372" y="262" text-anchor="start">via DCI network</text>
<rect class="node" x="445.0" y="171.0" width="70" height="30" rx="6"/><text class="nl" x="480" y="190" text-anchor="middle">core</text>
<text class="ns" x="480" y="213" text-anchor="middle">IPv6 only</text>
<rect class="node" x="595.0" y="171.0" width="70" height="30" rx="6"/><text class="nl" x="630" y="190" text-anchor="middle">exit-b</text>
<rect class="node gw" x="595.0" y="237.0" width="70" height="30" rx="6"/><text class="nl" x="630" y="256" text-anchor="middle">gw-b</text>
<text class="ns" x="588" y="250" text-anchor="end">gateway</text><text class="ns" x="588" y="262" text-anchor="end">via underlay</text>
<rect class="node" x="765.0" y="171.0" width="70" height="30" rx="6"/><text class="nl" x="800" y="190" text-anchor="middle">leaf-b</text>
<rect class="node" x="882.0" y="171.0" width="64" height="30" rx="6"/><text class="nl" x="914" y="190" text-anchor="middle">m-b</text>
<text class="ns" x="914" y="213" text-anchor="middle">tenant 1</text>
<text class="ns" x="480" y="286" text-anchor="middle">spines omitted</text>
<text class="scene" x="480" y="26" text-anchor="middle">Tenant VRFs stitched by open-dci gateways at the exits</text>
<g opacity="1"><animate attributeName="opacity" dur="18.0s" repeatCount="indefinite" calcMode="discrete" values="1;0" keyTimes="0;0.1333"/><rect class="h ip" x="345" y="80" width="270" height="16" rx="3"/><text class="ht" x="480" y="92" text-anchor="middle">IPv4  10.0.16.10 → 10.0.32.10</text></g>
<g opacity="0"><animate attributeName="opacity" dur="18.0s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.1333;0.2667"/><rect class="h ip" x="345" y="80" width="270" height="16" rx="3"/><text class="ht" x="480" y="92" text-anchor="middle">IPv4  10.0.16.10 → 10.0.32.10</text><rect class="h vx" x="345" y="62" width="270" height="16" rx="3"/><text class="ht" x="480" y="74" text-anchor="middle">VXLAN  VNI 3981 (tenant 1, A)</text></g>
<g opacity="0"><animate attributeName="opacity" dur="18.0s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.2667;0.4000"/><rect class="h ip" x="345" y="80" width="270" height="16" rx="3"/><text class="ht" x="480" y="92" text-anchor="middle">IPv4  10.0.16.10 → 10.0.32.10</text><rect class="h sr" x="345" y="62" width="270" height="16" rx="3"/><text class="ht" x="480" y="74" text-anchor="middle">SRv6  → fd00:dc1:b:1:: (End.DT46)</text><rect class="h dci" x="345" y="44" width="270" height="16" rx="3"/><text class="ht" x="480" y="56" text-anchor="middle">VXLAN  VNI 104100 (DCI network)</text></g>
<g opacity="0"><animate attributeName="opacity" dur="18.0s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.4000;0.5333"/><rect class="h ip" x="345" y="80" width="270" height="16" rx="3"/><text class="ht" x="480" y="92" text-anchor="middle">IPv4  10.0.16.10 → 10.0.32.10</text><rect class="h sr" x="345" y="62" width="270" height="16" rx="3"/><text class="ht" x="480" y="74" text-anchor="middle">SRv6  → fd00:dc1:b:1::</text></g>
<g opacity="0"><animate attributeName="opacity" dur="18.0s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.5333;0.6667"/><rect class="h ip" x="345" y="80" width="270" height="16" rx="3"/><text class="ht" x="480" y="92" text-anchor="middle">IPv4  10.0.16.10 → 10.0.32.10</text><rect class="h sr" x="345" y="62" width="270" height="16" rx="3"/><text class="ht" x="480" y="74" text-anchor="middle">SRv6  → fd00:dc1:b:1::</text></g>
<g opacity="0"><animate attributeName="opacity" dur="18.0s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.6667;0.8000"/><rect class="h ip" x="345" y="80" width="270" height="16" rx="3"/><text class="ht" x="480" y="92" text-anchor="middle">IPv4  10.0.16.10 → 10.0.32.10</text><rect class="h vx" x="345" y="62" width="270" height="16" rx="3"/><text class="ht" x="480" y="74" text-anchor="middle">VXLAN  VNI 4011 (tenant 1, B)</text></g>
<g opacity="0"><animate attributeName="opacity" dur="18.0s" repeatCount="indefinite" calcMode="discrete" values="0;1" keyTimes="0;0.8000"/><rect class="h ip" x="345" y="80" width="270" height="16" rx="3"/><text class="ht" x="480" y="92" text-anchor="middle">IPv4  10.0.16.10 → 10.0.32.10</text></g>
<g><animateTransform attributeName="transform" type="translate" dur="18.0s" repeatCount="indefinite" values="46 160;160 160;160 160;160 160;330 160;330 226;330 226;330 226;330 160;330 160;330 160;480 160;630 160;630 160;630 160;630 226;630 226;630 226;630 160;800 160;800 160;800 160;914 160;914 160" keyTimes="0.0000;0.0722;0.1333;0.1333;0.1854;0.2056;0.2667;0.2667;0.3389;0.4000;0.4000;0.4361;0.4722;0.5333;0.5333;0.6056;0.6667;0.6667;0.6869;0.7389;0.8000;0.8000;0.8722;1.0000"/><circle class="pkt" cx="0" cy="0" r="6"/></g>
<g opacity="1"><animate attributeName="opacity" dur="18.0s" repeatCount="indefinite" calcMode="discrete" values="1;0" keyTimes="0;0.1333"/><text class="cap" x="480" y="314" text-anchor="middle"><tspan font-weight="600">1/7  m-a → leaf-a:</tspan> A tenant machine sends a plain packet to its leaf.</text></g>
<g opacity="0"><animate attributeName="opacity" dur="18.0s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.1333;0.2667"/><text class="cap" x="480" y="314" text-anchor="middle"><tspan font-weight="600">2/7  leaf-a → gw-a:</tspan> EVPN type-5 through the fabric to gw-a, which open-dci made the VTEP of VNI 3981.</text></g>
<g opacity="0"><animate attributeName="opacity" dur="18.0s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.2667;0.4000"/><text class="cap" x="480" y="314" text-anchor="middle"><tspan font-weight="600">3/7  gw-a → exit-a:</tspan> SRv6 to gw-b's SID, carried to the exit in the DCI network.</text></g>
<g opacity="0"><animate attributeName="opacity" dur="18.0s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.4000;0.5333"/><text class="cap" x="480" y="314" text-anchor="middle"><tspan font-weight="600">4/7  exit-a → exit-b:</tspan> Between partitions only IPv6: locators, no tenants, no VNIs.</text></g>
<g opacity="0"><animate attributeName="opacity" dur="18.0s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.5333;0.6667"/><text class="cap" x="480" y="314" text-anchor="middle"><tspan font-weight="600">5/7  exit-b → gw-b:</tspan> Partition B's IPv6 underlay delivers it to gw-b, the SID's owner.</text></g>
<g opacity="0"><animate attributeName="opacity" dur="18.0s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.6667;0.8000"/><text class="cap" x="480" y="314" text-anchor="middle"><tspan font-weight="600">6/7  gw-b → leaf-b:</tspan> End.DT46 into the tenant VRF, type-5 with B's own VNI 4011.</text></g>
<g opacity="0"><animate attributeName="opacity" dur="18.0s" repeatCount="indefinite" calcMode="discrete" values="0;1" keyTimes="0;0.8000"/><text class="cap" x="480" y="314" text-anchor="middle"><tspan font-weight="600">7/7  leaf-b → m-b:</tspan> Delivered. Tenants never see SIDs or the transport.</text></g>
</svg>
