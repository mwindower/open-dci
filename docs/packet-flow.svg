<line class="link" x1="810" y1="170" x2="914" y2="170"/>
<rect class="node" x="14.0" y="155.0" width="64" height="30" rx="6"/><text class="nl" x="46" y="174" text-anchor="middle">m-a</text>
<text class="ns" x="46" y="197" text-anchor="middle">tenant 1</text>
<rect class="node" x="115.0" y="155.0" width="70" height="30" rx="6"/><text class="nl" x="150" y="174" text-anchor="middle">leaf-a</text>
<rect class="node" x="235.0" y="125.0" width="70" height="30" rx="6"/><text class="nl" x="270" y="144" text-anchor="middle">exit-a1</text>
<rect class="node" x="335.0" y="190.0" width="70" height="30" rx="6"/><text class="nl" x="370" y="209" text-anchor="middle">exit-a2</text>
<rect class="node gw" x="215.0" y="260.0" width="70" height="30" rx="6"/><text class="nl" x="250" y="279" text-anchor="middle">gw-a1</text>
