<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 262" width="960" height="262" role="img" aria-label="Animated packet flow: a tenant packet from machine m-a in partition A to m-b in partition B, encapsulated in VXLAN, then SRv6 through a DCI network and an IPv6 core, and back to VXLAN with partition B's VNI.">
<style>
  text { font-family: ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
  .title { font-size: 13px; font-weight: 600; }
  .part { fill: #f6f8fa; stroke: #d0d7de; }
  .plabel { font-size: 12px; font-weight: 600; fill: #59636e; }
  .link { stroke: #8c959f; stroke-width: 2; }
  .node { fill: #ffffff; stroke: #59636e; stroke-width: 1.5; }
  .gw { fill: #fff1e5; stroke: #bc4c00; stroke-width: 2; }
  .nl { font-size: 12px; font-weight: 600; }
  .ns { font-size: 10px; fill: #59636e; }
  .h { stroke: rgba(0,0,0,.25); }
  .ip { fill: #dafbe1; } .vx { fill: #ddf4ff; } .dci { fill: #eddeff; } .sr { fill: #ffe2cc; }
  .ht { font-size: 10.5px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .cap { font-size: 13px; }
  .pkt { fill: #bc4c00; } .tether { stroke: #bc4c00; stroke-width: 1.5; stroke-dasharray: 2 2; }
  @media (prefers-color-scheme: dark) {
    text { fill: #e6edf3; }
    .part { fill: #161b22; stroke: #3d444d; }
    .plabel, .ns { fill: #9198a1; }
    .link { stroke: #656c76; }
    .node { fill: #0d1117; stroke: #9198a1; }
    .gw { fill: #3d1d00; stroke: #f0883e; }
    .h { stroke: rgba(255,255,255,.2); }
    .ht { fill: #0d1117; }
    .pkt { fill: #f0883e; } .tether { stroke: #f0883e; }
  }
</style>
<rect class="part" x="8" y="8" width="420" height="186" rx="10"/><text class="plabel" x="20" y="28">Partition A · EVPN domain A</text>
<rect class="part" x="532" y="8" width="420" height="186" rx="10"/><text class="plabel" x="940" y="28" text-anchor="end">Partition B · EVPN domain B</text>
<line class="link" x1="44" y1="150" x2="916" y2="150"/>
<rect class="node" x="12.0" y="135" width="64" height="30" rx="6"/><text class="nl" x="44" y="154" text-anchor="middle">m-a</text><text class="ns" x="44" y="180" text-anchor="middle">10.0.16.10</text>
<rect class="node" x="115.0" y="135" width="70" height="30" rx="6"/><text class="nl" x="150" y="154" text-anchor="middle">leaf-a</text><text class="ns" x="150" y="180" text-anchor="middle">VTEP</text>
<rect class="node gw" x="227.0" y="135" width="70" height="30" rx="6"/><text class="nl" x="262" y="154" text-anchor="middle">fw-a</text><text class="ns" x="262" y="180" text-anchor="middle">srv6-dci</text>
<rect class="node" x="347.0" y="135" width="70" height="30" rx="6"/><text class="nl" x="382" y="154" text-anchor="middle">exit-a</text><text class="ns" x="382" y="180" text-anchor="middle">fabric/exit</text>
<rect class="node" x="445.0" y="135" width="70" height="30" rx="6"/><text class="nl" x="480" y="154" text-anchor="middle">core</text><text class="ns" x="480" y="180" text-anchor="middle">IPv6 only</text>
<rect class="node" x="543.0" y="135" width="70" height="30" rx="6"/><text class="nl" x="578" y="154" text-anchor="middle">exit-b</text><text class="ns" x="578" y="180" text-anchor="middle">fabric/exit</text>
<rect class="node gw" x="663.0" y="135" width="70" height="30" rx="6"/><text class="nl" x="698" y="154" text-anchor="middle">fw-b</text><text class="ns" x="698" y="180" text-anchor="middle">srv6-dci</text>
<rect class="node" x="775.0" y="135" width="70" height="30" rx="6"/><text class="nl" x="810" y="154" text-anchor="middle">leaf-b</text><text class="ns" x="810" y="180" text-anchor="middle">VTEP</text>
<rect class="node" x="884.0" y="135" width="64" height="30" rx="6"/><text class="nl" x="916" y="154" text-anchor="middle">m-b</text><text class="ns" x="916" y="180" text-anchor="middle">10.0.32.10</text>
<g><animateTransform attributeName="transform" type="translate" dur="19.2s" repeatCount="indefinite" values="115.0 0;150 0;150 0;150 0;262 0;262 0;262 0;382 0;382 0;382 0;578 0;578 0;578 0;698 0;698 0;698 0;810 0;810 0;810 0;845.0 0;845.0 0;845.0 0" keyTimes="0.0000;0.0781;0.1250;0.1250;0.2031;0.2500;0.2500;0.3281;0.3750;0.3750;0.4531;0.5000;0.5000;0.5781;0.6250;0.6250;0.7031;0.7500;0.7500;0.8281;0.8750;1.0000"/>
<g opacity="1"><animate attributeName="opacity" dur="19.2s" repeatCount="indefinite" calcMode="discrete" values="1;0" keyTimes="0;0.1250"/><rect class="h ip" x="-103.0" y="98" width="206" height="16" rx="3"/><text class="ht" x="0" y="110" text-anchor="middle">IPv4  10.0.16.10 → 10.0.32.10</text></g>
<g opacity="0"><animate attributeName="opacity" dur="19.2s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.1250;0.2500"/><rect class="h vx" x="-103.0" y="80" width="206" height="16" rx="3"/><text class="ht" x="0" y="92" text-anchor="middle">VXLAN  VNI 3981 (tenant A)</text><rect class="h ip" x="-103.0" y="98" width="206" height="16" rx="3"/><text class="ht" x="0" y="110" text-anchor="middle">IPv4  10.0.16.10 → 10.0.32.10</text></g>
<g opacity="0"><animate attributeName="opacity" dur="19.2s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.2500;0.3750"/><rect class="h dci" x="-103.0" y="62" width="206" height="16" rx="3"/><text class="ht" x="0" y="74" text-anchor="middle">VXLAN  VNI 104100 (DCI)</text><rect class="h sr" x="-103.0" y="80" width="206" height="16" rx="3"/><text class="ht" x="0" y="92" text-anchor="middle">SRv6  → fd00:dc1:b:1:: (End.DT46)</text><rect class="h ip" x="-103.0" y="98" width="206" height="16" rx="3"/><text class="ht" x="0" y="110" text-anchor="middle">IPv4  10.0.16.10 → 10.0.32.10</text></g>
<g opacity="0"><animate attributeName="opacity" dur="19.2s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.3750;0.5000"/><rect class="h sr" x="-103.0" y="80" width="206" height="16" rx="3"/><text class="ht" x="0" y="92" text-anchor="middle">SRv6  → fd00:dc1:b:1::</text><rect class="h ip" x="-103.0" y="98" width="206" height="16" rx="3"/><text class="ht" x="0" y="110" text-anchor="middle">IPv4  10.0.16.10 → 10.0.32.10</text></g>
<g opacity="0"><animate attributeName="opacity" dur="19.2s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.5000;0.6250"/><rect class="h dci" x="-103.0" y="62" width="206" height="16" rx="3"/><text class="ht" x="0" y="74" text-anchor="middle">VXLAN  VNI 204100 (DCI)</text><rect class="h sr" x="-103.0" y="80" width="206" height="16" rx="3"/><text class="ht" x="0" y="92" text-anchor="middle">SRv6  → fd00:dc1:b:1::</text><rect class="h ip" x="-103.0" y="98" width="206" height="16" rx="3"/><text class="ht" x="0" y="110" text-anchor="middle">IPv4  10.0.16.10 → 10.0.32.10</text></g>
<g opacity="0"><animate attributeName="opacity" dur="19.2s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.6250;0.7500"/><rect class="h vx" x="-103.0" y="80" width="206" height="16" rx="3"/><text class="ht" x="0" y="92" text-anchor="middle">VXLAN  VNI 4011 (tenant B)</text><rect class="h ip" x="-103.0" y="98" width="206" height="16" rx="3"/><text class="ht" x="0" y="110" text-anchor="middle">IPv4  10.0.16.10 → 10.0.32.10</text></g>
<g opacity="0"><animate attributeName="opacity" dur="19.2s" repeatCount="indefinite" calcMode="discrete" values="0;1" keyTimes="0;0.7500"/><rect class="h ip" x="-103.0" y="98" width="206" height="16" rx="3"/><text class="ht" x="0" y="110" text-anchor="middle">IPv4  10.0.16.10 → 10.0.32.10</text></g>
</g>
<g><animateTransform attributeName="transform" type="translate" dur="19.2s" repeatCount="indefinite" values="44 0;150 0;150 0;150 0;262 0;262 0;262 0;382 0;382 0;382 0;578 0;578 0;578 0;698 0;698 0;698 0;810 0;810 0;810 0;916 0;916 0;916 0" keyTimes="0.0000;0.0781;0.1250;0.1250;0.2031;0.2500;0.2500;0.3281;0.3750;0.3750;0.4531;0.5000;0.5000;0.5781;0.6250;0.6250;0.7031;0.7500;0.7500;0.8281;0.8750;1.0000"/>
<line class="tether" x1="0" y1="116" x2="0" y2="128"/><circle class="pkt" cx="0" cy="130" r="5"/>
</g>
<g opacity="1"><animate attributeName="opacity" dur="19.2s" repeatCount="indefinite" calcMode="discrete" values="1;0" keyTimes="0;0.1250"/><text class="cap" x="480.0" y="226" text-anchor="middle"><tspan font-weight="600">1/7  m-a → leaf-a:</tspan> Machine sends a plain tenant packet to its leaf.</text></g>
<g opacity="0"><animate attributeName="opacity" dur="19.2s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.1250;0.2500"/><text class="cap" x="480.0" y="226" text-anchor="middle"><tspan font-weight="600">2/7  leaf-a → fw-a:</tspan> Leaf routes it in the tenant VRF to the firewall: EVPN type-5, tenant VNI 3981.</text></g>
<g opacity="0"><animate attributeName="opacity" dur="19.2s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.2500;0.3750"/><text class="cap" x="480.0" y="226" text-anchor="middle"><tspan font-weight="600">3/7  fw-a → exit-a:</tspan> srv6-dci gateway: SRv6-encapsulated to fw-b's SID, carried to the exit in the DCI network.</text></g>
<g opacity="0"><animate attributeName="opacity" dur="19.2s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.3750;0.5000"/><text class="cap" x="480.0" y="226" text-anchor="middle"><tspan font-weight="600">4/7  exit-a → exit-b:</tspan> Between partitions: plain IPv6. Exits and core only know locators, no tenants, no VNIs.</text></g>
<g opacity="0"><animate attributeName="opacity" dur="19.2s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.5000;0.6250"/><text class="cap" x="480.0" y="226" text-anchor="middle"><tspan font-weight="600">5/7  exit-b → fw-b:</tspan> Partition B's DCI network delivers it to fw-b, the owner of the SID.</text></g>
<g opacity="0"><animate attributeName="opacity" dur="19.2s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.6250;0.7500"/><text class="cap" x="480.0" y="226" text-anchor="middle"><tspan font-weight="600">6/7  fw-b → leaf-b:</tspan> End.DT46: decapsulate, look up in the tenant VRF, EVPN type-5 with B's own VNI 4011.</text></g>
<g opacity="0"><animate attributeName="opacity" dur="19.2s" repeatCount="indefinite" calcMode="discrete" values="0;1" keyTimes="0;0.7500"/><text class="cap" x="480.0" y="226" text-anchor="middle"><tspan font-weight="600">7/7  leaf-b → m-b:</tspan> Delivered. Different VNIs, ASNs and RTs per partition, and no stretched EVPN.</text></g>
<text class="ns" x="480.0" y="250" text-anchor="middle">srv6-dci · tenant VRFs stitched across EVPN domains via SRv6 L3VPN</text>
</svg>
