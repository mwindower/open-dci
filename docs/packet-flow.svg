<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 356" width="960" height="356" role="img" aria-label="Animated packet flow: each partition has two exits and a redundant gateway pair attached to both. A tenant packet from m-a travels over VXLAN with VNI 3981 through leaf-a and exit-a1 to gw-a1, which provisioned the tenant VRF. gw-a1 encapsulates it in SRv6 to partition B's anycast SID and sends it in the DCI network (VNI 104100) via the other exit, exit-a2, into the core. exit-b1 delivers it to gw-b2, which decapsulates it (End.DT46) and forwards it with partition B's VNI 4011 via exit-b2 and leaf-b to m-b.">
<style>
  text { font-family: ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
  .scene { font-size: 13px; font-weight: 600; }
  .part { fill: #f6f8fa; stroke: #d0d7de; }
  .plabel { font-size: 12px; font-weight: 600; fill: #59636e; }
  .link { stroke: #8c959f; stroke-width: 2; }
  .node { fill: #ffffff; stroke: #59636e; stroke-width: 1.5; }
  .gw { fill: #fff1e5; stroke: #bc4c00; stroke-width: 2; }
  .nl { font-size: 12px; font-weight: 600; }
  .ns { font-size: 10px; fill: #59636e; }
  .h { stroke: rgba(0,0,0,.25); }
  .ip { fill: #dafbe1; } .vx { fill: #ddf4ff; } .dci { fill: #eddeff; } .sr { fill: #ffe2cc; }
  .ht { font-size: 10.5px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .cap { font-size: 13px; }
  .pkt { fill: #bc4c00; }
  @media (prefers-color-scheme: dark) {
    text { fill: #e6edf3; }
    .part { fill: #161b22; stroke: #3d444d; }
    .plabel, .ns { fill: #9198a1; }
    .link { stroke: #656c76; }
    .node { fill: #0d1117; stroke: #9198a1; }
    .gw { fill: #3d1d00; stroke: #f0883e; }
    .h { stroke: rgba(255,255,255,.2); }
    .ht { fill: #0d1117; }
    .pkt { fill: #f0883e; }
  }
</style>
<rect class="part" x="8" y="104" width="400" height="216" rx="10"/><text class="plabel" x="20" y="124">Partition A · EVPN domain A</text>
<rect class="part" x="552" y="104" width="400" height="216" rx="10"/><text class="plabel" x="940" y="124" text-anchor="end">Partition B · EVPN domain B</text>
<line class="link" x1="46" y1="170" x2="150" y2="170"/>
<line class="link" x1="150" y1="170" x2="270" y2="140"/>
<line class="link" x1="150" y1="170" x2="370" y2="205"/>
