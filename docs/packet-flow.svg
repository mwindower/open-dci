<rect class="node" x="445.0" y="155.0" width="70" height="30" rx="6"/><text class="nl" x="480" y="174" text-anchor="middle">core</text>
<text class="ns" x="480" y="197" text-anchor="middle">IPv6 only</text>
<rect class="node" x="655.0" y="125.0" width="70" height="30" rx="6"/><text class="nl" x="690" y="144" text-anchor="middle">exit-b1</text>
<rect class="node" x="555.0" y="190.0" width="70" height="30" rx="6"/><text class="nl" x="590" y="209" text-anchor="middle">exit-b2</text>
<rect class="node gw" x="595.0" y="260.0" width="70" height="30" rx="6"/><text class="nl" x="630" y="279" text-anchor="middle">gw-b1</text>
<rect class="node gw" x="675.0" y="260.0" width="70" height="30" rx="6"/><text class="nl" x="710" y="279" text-anchor="middle">gw-b2</text>
<rect class="node" x="775.0" y="155.0" width="70" height="30" rx="6"/><text class="nl" x="810" y="174" text-anchor="middle">leaf-b</text>
<rect class="node" x="882.0" y="155.0" width="64" height="30" rx="6"/><text class="nl" x="914" y="174" text-anchor="middle">m-b</text>
<text class="ns" x="914" y="197" text-anchor="middle">tenant 1</text>
<text class="ns" x="290" y="303" text-anchor="middle">anycast locator fd00:dc1:a::/48</text><text class="ns" x="290" y="314" text-anchor="middle">transport: DCI network</text>
<text class="ns" x="670" y="303" text-anchor="middle">anycast locator fd00:dc1:b::/48</text><text class="ns" x="670" y="314" text-anchor="middle">transport: underlay</text>
<text class="ns" x="480" y="312" text-anchor="middle">spines omitted</text>
<text class="scene" x="480" y="26" text-anchor="middle">Tenant VRFs stitched by redundant gateway pairs, dual-attached to two exits</text>
<g opacity="1"><animate attributeName="opacity" dur="18.0s" repeatCount="indefinite" calcMode="discrete" values="1;0" keyTimes="0;0.1333"/><rect class="h ip" x="345" y="80" width="270" height="16" rx="3"/><text class="ht" x="480" y="92" text-anchor="middle">IPv4  10.0.16.10 → 10.0.32.10</text></g>
<g opacity="0"><animate attributeName="opacity" dur="18.0s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.1333;0.2667"/><rect class="h ip" x="345" y="80" width="270" height="16" rx="3"/><text class="ht" x="480" y="92" text-anchor="middle">IPv4  10.0.16.10 → 10.0.32.10</text><rect class="h vx" x="345" y="62" width="270" height="16" rx="3"/><text class="ht" x="480" y="74" text-anchor="middle">VXLAN  VNI 3981 (tenant 1, A)</text></g>
<g opacity="0"><animate attributeName="opacity" dur="18.0s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.2667;0.4000"/><rect class="h ip" x="345" y="80" width="270" height="16" rx="3"/><text class="ht" x="480" y="92" text-anchor="middle">IPv4  10.0.16.10 → 10.0.32.10</text><rect class="h sr" x="345" y="62" width="270" height="16" rx="3"/><text class="ht" x="480" y="74" text-anchor="middle">SRv6  → fd00:dc1:b:fab:: (End.DT46)</text><rect class="h dci" x="345" y="44" width="270" height="16" rx="3"/><text class="ht" x="480" y="56" text-anchor="middle">VXLAN  VNI 104100 (DCI network)</text></g>
<g opacity="0"><animate attributeName="opacity" dur="18.0s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.4000;0.5333"/><rect class="h ip" x="345" y="80" width="270" height="16" rx="3"/><text class="ht" x="480" y="92" text-anchor="middle">IPv4  10.0.16.10 → 10.0.32.10</text><rect class="h sr" x="345" y="62" width="270" height="16" rx="3"/><text class="ht" x="480" y="74" text-anchor="middle">SRv6  → fd00:dc1:b:fab::</text></g>
<g opacity="0"><animate attributeName="opacity" dur="18.0s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.5333;0.6667"/><rect class="h ip" x="345" y="80" width="270" height="16" rx="3"/><text class="ht" x="480" y="92" text-anchor="middle">IPv4  10.0.16.10 → 10.0.32.10</text><rect class="h sr" x="345" y="62" width="270" height="16" rx="3"/><text class="ht" x="480" y="74" text-anchor="middle">SRv6  → fd00:dc1:b:fab::</text></g>
<g opacity="0"><animate attributeName="opacity" dur="18.0s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.6667;0.8000"/><rect class="h ip" x="345" y="80" width="270" height="16" rx="3"/><text class="ht" x="480" y="92" text-anchor="middle">IPv4  10.0.16.10 → 10.0.32.10</text><rect class="h vx" x="345" y="62" width="270" height="16" rx="3"/><text class="ht" x="480" y="74" text-anchor="middle">VXLAN  VNI 4011 (tenant 1, B)</text></g>
<g opacity="0"><animate attributeName="opacity" dur="18.0s" repeatCount="indefinite" calcMode="discrete" values="0;1" keyTimes="0;0.8000"/><rect class="h ip" x="345" y="80" width="270" height="16" rx="3"/><text class="ht" x="480" y="92" text-anchor="middle">IPv4  10.0.16.10 → 10.0.32.10</text></g>
<g><animateTransform attributeName="transform" type="translate" dur="18.0s" repeatCount="indefinite" values="46 144;150 144;150 144;150 144;270 114;250 249;250 249;250 249;370 179;370 179;370 179;480 144;690 114;690 114;690 114;710 249;710 249;710 249;590 179;810 144;810 144;810 144;914 144;914 144" keyTimes="0.0000;0.0722;0.1333;0.1333;0.1677;0.2056;0.2667;0.2667;0.3389;0.4000;0.4000;0.4255;0.4722;0.5333;0.5333;0.6056;0.6667;0.6667;0.6944;0.7389;0.8000;0.8000;0.8722;1.0000"/><circle class="pkt" cx="0" cy="0" r="6"/></g>
<g opacity="1"><animate attributeName="opacity" dur="18.0s" repeatCount="indefinite" calcMode="discrete" values="1;0" keyTimes="0;0.1333"/><text class="cap" x="480" y="340" text-anchor="middle"><tspan font-weight="600">1/7  m-a → leaf-a:</tspan> A tenant machine sends a plain packet to its leaf.</text></g>
<g opacity="0"><animate attributeName="opacity" dur="18.0s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.1333;0.2667"/><text class="cap" x="480" y="340" text-anchor="middle"><tspan font-weight="600">2/7  leaf-a → gw-a1:</tspan> EVPN type-5 via either exit to either gateway (ECMP): both are VTEPs of VNI 3981.</text></g>
<g opacity="0"><animate attributeName="opacity" dur="18.0s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.2667;0.4000"/><text class="cap" x="480" y="340" text-anchor="middle"><tspan font-weight="600">3/7  gw-a1 → exit-a2:</tspan> SRv6 to B's anycast SID, in the DCI network via the gateway's other exit.</text></g>
<g opacity="0"><animate attributeName="opacity" dur="18.0s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.4000;0.5333"/><text class="cap" x="480" y="340" text-anchor="middle"><tspan font-weight="600">4/7  exit-a2 → exit-b1:</tspan> Between partitions only IPv6: locators, no tenants, no VNIs.</text></g>
<g opacity="0"><animate attributeName="opacity" dur="18.0s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.5333;0.6667"/><text class="cap" x="480" y="340" text-anchor="middle"><tspan font-weight="600">5/7  exit-b1 → gw-b2:</tspan> Both gateways own the SID; a gateway or an exit can fail without BGP changes.</text></g>
<g opacity="0"><animate attributeName="opacity" dur="18.0s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.6667;0.8000"/><text class="cap" x="480" y="340" text-anchor="middle"><tspan font-weight="600">6/7  gw-b2 → leaf-b:</tspan> End.DT46 into the tenant VRF, type-5 with B's own VNI 4011.</text></g>
<g opacity="0"><animate attributeName="opacity" dur="18.0s" repeatCount="indefinite" calcMode="discrete" values="0;1" keyTimes="0;0.8000"/><text class="cap" x="480" y="340" text-anchor="middle"><tspan font-weight="600">7/7  leaf-b → m-b:</tspan> Delivered. Tenants never see SIDs or the transport.</text></g>
</svg>
