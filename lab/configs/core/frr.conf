frr defaults datacenter
hostname core
log stdout informational
!
! zebra: no kernel nexthop groups. With them, zebra reuses a group whose
! next hop went inactive (link down) for the route BGP re-sent without it, and
! revives that next hop when the link comes back, before BGP has a path via
! it: traffic goes to a neighbour that can't forward it yet (FRR 10.4, 10.6).
no zebra nexthop kernel enable
!
! BFD: detects a neighbour that stops forwarding while its link stays up
! (hung node, one-way link) in 3 x 300 ms instead of the 8-9 s hold time
bfd
 profile dci
  transmit-interval 300
  receive-interval 300
  detect-multiplier 3
 exit
exit
!
! What the core announces to each exit link. exit-a1/a2 have two links each,
! and each link only gets what its VRF needs:
!   DCI VRF (swp1, swp4):      locator block (locators, gateway loopbacks), core loopback
!   default VRF (swp3, swp5):  exit loopbacks, for the VPN relay sessions
! Exits in underlay-transport partitions (swp2, swp6, swp7, swp8) get both.
ipv6 prefix-list SRV6 seq 10 permit fd00:dc1::/32 le 128
ipv6 prefix-list SRV6 seq 20 permit 2001:db8:c::1/128
ipv6 prefix-list RELAY seq 10 permit 2001:db8:e::/48 le 128
!
route-map TO-DCI permit 10
 match ipv6 address prefix-list SRV6
exit
!
route-map TO-RELAY permit 10
 match ipv6 address prefix-list RELAY
exit
!
route-map TO-UNDERLAY permit 10
 match ipv6 address prefix-list SRV6
exit
route-map TO-UNDERLAY permit 20
 match ipv6 address prefix-list RELAY
exit
!
! FRR 10.4.1 doesn't tear these sessions down when BFD goes down (it does
! on the spines and gateways): a hung exit is only noticed by the hold timer,
! so it is short here (1 s keepalive, 3 s hold; negotiated for both sides).
router bgp 4200000100
 bgp router-id 10.255.0.1
 no bgp default ipv4-unicast
 bgp bestpath as-path multipath-relax
 neighbor swp1 interface remote-as external
 neighbor swp1 bfd profile dci
 neighbor swp1 timers 1 3
 neighbor swp2 interface remote-as external
 neighbor swp2 bfd profile dci
 neighbor swp2 timers 1 3
 neighbor swp3 interface remote-as external
 neighbor swp3 bfd profile dci
 neighbor swp3 timers 1 3
 neighbor swp4 interface remote-as external
 neighbor swp4 bfd profile dci
 neighbor swp4 timers 1 3
 neighbor swp5 interface remote-as external
 neighbor swp5 bfd profile dci
 neighbor swp5 timers 1 3
 neighbor swp6 interface remote-as external
 neighbor swp6 bfd profile dci
 neighbor swp6 timers 1 3
 neighbor swp7 interface remote-as external
 neighbor swp7 bfd profile dci
 neighbor swp7 timers 1 3
 neighbor swp8 interface remote-as external
 neighbor swp8 bfd profile dci
 neighbor swp8 timers 1 3
 !
 address-family ipv6 unicast
  network 2001:db8:c::1/128
  neighbor swp1 activate
  neighbor swp1 route-map TO-DCI out
  neighbor swp2 activate
  neighbor swp2 route-map TO-UNDERLAY out
  neighbor swp3 activate
  neighbor swp3 route-map TO-RELAY out
  neighbor swp4 activate
  neighbor swp4 route-map TO-DCI out
  neighbor swp5 activate
  neighbor swp5 route-map TO-RELAY out
  neighbor swp6 activate
  neighbor swp6 route-map TO-UNDERLAY out
  neighbor swp7 activate
  neighbor swp7 route-map TO-UNDERLAY out
  neighbor swp8 activate
  neighbor swp8 route-map TO-UNDERLAY out
 exit-address-family
exit
!
