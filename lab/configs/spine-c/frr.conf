frr defaults datacenter
hostname spine-c
log stdout informational
!
! zebra: no kernel nexthop groups. With them, zebra reuses a group whose
! next hop went inactive (link down) for the route BGP re-sent without it, and
! revives that next hop when the link comes back, before BGP has a path via
! it: traffic goes to a neighbour that can't forward it yet (FRR 10.6).
no zebra nexthop kernel enable
!
! BFD: detects a neighbour that stops forwarding while its link stays up
! (hung node, one-way link) in 3 x 300 ms instead of the 8-9 s hold time
bfd
 profile dci
  transmit-interval 300
  receive-interval 300
  detect-multiplier 3
 exit
exit
!
router bgp 4200000033
 bgp router-id 10.0.2.13
 bgp bestpath as-path multipath-relax
 neighbor FABRIC peer-group
 neighbor FABRIC remote-as external
 neighbor FABRIC timers 2 8
 neighbor swp1 interface peer-group FABRIC
 neighbor swp2 interface peer-group FABRIC
 neighbor swp2 bfd profile dci
 neighbor swp3 interface peer-group FABRIC
 neighbor swp3 bfd profile dci
 !
 address-family ipv4 unicast
  network 10.0.2.13/32
 exit-address-family
 !
 address-family l2vpn evpn
  neighbor FABRIC activate
  neighbor FABRIC allowas-in 2
 exit-address-family
exit
!
