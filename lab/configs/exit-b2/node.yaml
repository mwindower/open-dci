# exit exit-b2 of partition B (one of two): no DCI network; the SRv6 transport runs
# in the underlay, so the core link (swp2) is in the default VRF. Both gateways
# hang off swp3/swp4 (their uplink1) like any fabric peer; the shared locator
# arrives from both (ECMP). The gateways' other uplink goes to exit-b1.
waitInterfaces: [swp1, swp2, swp3, swp4]
loopback: [10.0.1.18/32, "2001:db8:e::b2/128"]
interfaces:
  - {name: swp1, mtu: 9216}
  - {name: swp2, mtu: 9216}
  - {name: swp3, mtu: 9216}
  - {name: swp4, mtu: 9216}
# edge of the SRv6 domain (in a real exit: switch ACLs). The locator block
# fd00:dc1::/32 is only reachable from the gateways (swp3/swp4) and from the
# core with a source inside the block; the fabric never reaches it.
edgeFilter:
  - {name: core-spoofed, iif: swp2, daddr: "fd00:dc1::/32", saddrNot: "fd00:dc1::/32"}
  - {name: fabric-to-transport, iif: swp1, daddr: "fd00:dc1::/32"}
  - {name: fabric-spoofed, iif: swp1, saddr: "fd00:dc1::/32"}
