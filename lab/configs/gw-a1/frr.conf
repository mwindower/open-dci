! dedicated gateway: the operator's base config, with the DCI network but no
! tenant VRFs. open-dci adds the tenant VRFs with their L3VNIs and the SRv6
! L3VPN at runtime ("open-dci render" shows the exact lines).
! Both gateways of the pair share the ASN: each drops routes the other one
! re-announced into the fabric (AS path), which prevents loops and detours.
frr defaults datacenter
hostname gw-a1
log stdout informational
!
! BFD: detects a neighbour that stops forwarding while its link stays up
! (hung node, one-way link) in 3 x 300 ms instead of the 8-9 s hold time
bfd
 profile dci
  transmit-interval 300
  receive-interval 300
  detect-multiplier 3
 exit
exit
!
vrf vrf104100
 vni 104100
exit-vrf
!
router bgp 4200000016
 bgp router-id 10.0.0.16
 bgp bestpath as-path multipath-relax
 neighbor FABRIC peer-group
 neighbor FABRIC remote-as external
 neighbor FABRIC timers 2 8
 neighbor FABRIC bfd profile dci
 neighbor uplink0 interface peer-group FABRIC
 neighbor uplink1 interface peer-group FABRIC
 !
 address-family ipv4 unicast
  network 10.0.0.16/32
  neighbor FABRIC route-map only-self-out out
 exit-address-family
 !
 ! required for the L3VNIs open-dci provisions
 address-family l2vpn evpn
  neighbor FABRIC activate
  advertise-all-vni
 exit-address-family
exit
!
! DCI network: carries the SRv6 transport through the fabric to exit-a
! (open-dci adds "redistribute static" for the own locator)
router bgp 4200000016 vrf vrf104100
 bgp router-id 10.0.0.16
 no bgp enforce-first-as
 bgp bestpath as-path multipath-relax
 !
 address-family l2vpn evpn
  advertise ipv4 unicast
  advertise ipv6 unicast
 exit-address-family
exit
!
! dual-attached: announce only the own prefixes (VTEP loopback; open-dci's
! locator and loopback), never transit between the two exits
route-map only-self-out permit 10
 match as-path SELF
exit
route-map only-self-out deny 20
exit
!
bgp as-path access-list SELF seq 5 permit ^$
!
