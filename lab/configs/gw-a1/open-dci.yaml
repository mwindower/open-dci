# open-dci config of gw-a1: one of the two redundant gateways at exit-a. Both share
# the locator (anycast) and pin their SIDs, so remote gateways reach either one
# with the same SID. The SRv6 transport runs in the DCI network of the base config.
gateway:
  locator: fd00:dc1:a::/48        # shared by gw-a1 and gw-a2 (anycast); SIDs fd00:dc1:a:<sid>::
  loopback: fd00:dc1:ff::a1        # this gateway's own address: SRv6 encap source
  locatorBlock: fd00:dc1::/32     # all gateways' locators and loopbacks
transport:
  vrf: vrf104100                  # DCI network (base config) carrying the SRv6 transport
peers:                           # the sessions to both exits (base config); the
  - interface: uplink0            # exits relay the VPN routes between the partitions
  - interface: uplink1
networks:
  - vrf: vrf3981                  # created by open-dci (kernel table 3981 = the VNI)
    vni: 3981                     # tenant 1's VNI in partition A (as on leaf-a); SID function = VNI
    routeTarget: "65535:1001"     # the stitched network's global identity
    defaultRoute: import          # a default route from partition C (its breakout), behind a local one
    aggregates:                   # tenant 1's ranges, one per partition, same on all gateways;
                                  # each pair announces its own range instead of the host routes
      - 10.0.16.0/24              #   partition A
      - 10.0.32.0/24              #   partition B
      - 10.0.48.0/24              #   partition C
      - 2001:db8:16::/48
      - 2001:db8:32::/48
      - 2001:db8:48::/48
# tenant 2 comes from metal-apiserver (in the lab: the fake one on the core,
# configs/core/metal-api.yaml): all private networks of project tenant-2, one per
# partition, become one stitched network; its VNI here is the VRF ID of the
# partition-a network (vrf3982), the route target is derived from the project.
source:
  metalStack:
    url: http://core:8080
    partition: a                    # this gateway's partition
    interval: 5s                    # lab: react quickly (default 30s)
    routeTargetASN: 65535           # namespace of the derived route targets
    projects: [tenant-2, tenant-3, tenant-4]   # stitch all private networks of these
                                    # projects, one stitched network per project (tenant-3/4:
                                    # only while e2e tests add them); the alternative is
                                    # "label: <key>": only labelled networks, by label value
