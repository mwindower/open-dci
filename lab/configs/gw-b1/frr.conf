! dedicated gateway: the operator's base config (no tenant VRFs). open-dci
! adds the tenant VRFs with their L3VNIs and the SRv6 L3VPN at runtime.
! Both gateways of the pair share the ASN: each drops routes the other one
! re-announced into the fabric (AS path), which prevents loops and detours.
frr defaults datacenter
hostname gw-b1
log stdout informational
!
router bgp 4200000026
 bgp router-id 10.0.1.16
 bgp bestpath as-path multipath-relax
 neighbor FABRIC peer-group
 neighbor FABRIC remote-as external
 neighbor FABRIC timers 2 8
 neighbor uplink0 interface peer-group FABRIC
 !
 address-family ipv4 unicast
  network 10.0.1.16/32
 exit-address-family
 !
 ! open-dci announces the locator here (transport in the default VRF)
 address-family ipv6 unicast
  neighbor FABRIC activate
 exit-address-family
 !
 ! required for the L3VNIs open-dci provisions
 address-family l2vpn evpn
  neighbor FABRIC activate
  advertise-all-vni
 exit-address-family
exit
!
