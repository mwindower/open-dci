# exit: terminates the DCI network (vrf104100) and routes it into the
# inter-partition core on swp2. DCI devices sized for SRv6 (9000 + 48 B).
# The redundant gateways gw-a1/gw-a2 hang off swp3/swp4 like any fabric peer
# and reach the DCI network via EVPN; the shared locator arrives from both
# (ECMP).
waitInterfaces: [swp1, swp2, swp3, swp4]
loopback: [10.0.0.14/32]
vrfs:
  - {name: vrf104100, table: 1001}
bridge: {name: bridge, mtu: 9166}
vnis:
  - {vni: 104100, vlan: 1001, vrf: vrf104100, local: 10.0.0.14, mtu: 9166}
interfaces:
  - {name: swp1, mtu: 9216}
  - {name: swp2, vrf: vrf104100, mtu: 9216}
  - {name: swp3, mtu: 9216}
  - {name: swp4, mtu: 9216}
# edge of the SRv6 domain (in a real exit: switch ACLs). The locator block
# fd00:dc1::/32 is only reachable from the gateways (swp3/swp4) and from the
# core with a source inside the block; the fabric never reaches it.
edgeFilter:
  - {name: core-spoofed, iif: swp2, daddr: "fd00:dc1::/32", saddrNot: "fd00:dc1::/32"}
  - {name: fabric-to-transport, iif: swp1, daddr: "fd00:dc1::/32"}
  - {name: fabric-spoofed, iif: swp1, saddr: "fd00:dc1::/32"}
