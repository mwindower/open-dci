frr defaults datacenter
hostname exit-a
log stdout informational
!
vrf vrf104100
 vni 104100
exit-vrf
!
router bgp 4200000014
 bgp router-id 10.0.0.14
 bgp bestpath as-path multipath-relax
 neighbor FABRIC peer-group
 neighbor FABRIC remote-as external
 neighbor FABRIC timers 2 8
 neighbor swp1 interface peer-group FABRIC
 neighbor swp3 interface peer-group FABRIC
 neighbor swp4 interface peer-group FABRIC
 ! VPN relay between the partitions (allowas-in: the gateways' VPN routes carry
 ! the exit's own AS, learned via EVPN through it). The gateways (swp3/swp4) send their VPN
 ! routes here; exit-a passes them on to the other exits and back to its
 ! gateways (gw-a1/gw-a2 drop each other's: shared ASN). Nothing is imported.
 neighbor swp5 interface remote-as external
 neighbor 2001:db8:e::b remote-as 4200000024
 neighbor 2001:db8:e::b ebgp-multihop 8
 neighbor 2001:db8:e::b update-source 2001:db8:e::a
 neighbor 2001:db8:e::b capability extended-nexthop
 !
 address-family ipv4 unicast
  network 10.0.0.14/32
  no neighbor swp5 activate
  no neighbor 2001:db8:e::b activate
 exit-address-family
 !
 ! the exit loopbacks, for the VPN sessions between the exits
 address-family ipv6 unicast
  network 2001:db8:e::a/128
  neighbor swp5 activate
 exit-address-family
 !
 address-family ipv4 vpn
  neighbor swp3 activate
  neighbor swp3 allowas-in 1
  neighbor swp4 activate
  neighbor swp4 allowas-in 1
  neighbor 2001:db8:e::b activate
 exit-address-family
 !
 address-family ipv6 vpn
  neighbor swp3 activate
  neighbor swp3 allowas-in 1
  neighbor swp4 activate
  neighbor swp4 allowas-in 1
  neighbor 2001:db8:e::b activate
 exit-address-family
 !
 address-family l2vpn evpn
  neighbor FABRIC activate
  neighbor FABRIC allowas-in 2
  advertise-all-vni
 exit-address-family
exit
!
! DCI network: EVPN towards the partition, plain IPv6 towards the core
router bgp 4200000014 vrf vrf104100
 bgp router-id 10.0.0.14
 no bgp enforce-first-as
 bgp bestpath as-path multipath-relax
 neighbor swp2 interface remote-as external
 !
 address-family ipv4 unicast
  no neighbor swp2 activate
 exit-address-family
 !
 address-family ipv6 unicast
  neighbor swp2 activate
 exit-address-family
 !
 address-family l2vpn evpn
  advertise ipv6 unicast
 exit-address-family
exit
!
