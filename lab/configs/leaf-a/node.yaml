# leaf (stand-in for a metal-stack SONiC leaf): one tenant VRF per machine port
# (tenant 1 on swp1, tenant 2 on swp2), spine on swp31
waitInterfaces: [swp1, swp2, swp31]
loopback: [10.0.0.11/32]
vrfs:
  - {name: vrf3981, table: 1000}
  - {name: vrf3982, table: 1001}
bridge: {name: bridge, mtu: 9000}
vnis:
  - {vni: 3981, vlan: 1000, vrf: vrf3981, local: 10.0.0.11, mtu: 9000}
  - {vni: 3982, vlan: 1001, vrf: vrf3982, local: 10.0.0.11, mtu: 9000}
interfaces:
  - {name: swp1, vrf: vrf3981, mtu: 9000}
  - {name: swp2, vrf: vrf3982, mtu: 9000}
  - {name: swp31, mtu: 9216}
