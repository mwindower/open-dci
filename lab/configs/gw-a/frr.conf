! dedicated gateway: the operator's base config (no tenant VRFs). open-dci
! adds the tenant VRFs with their L3VNIs and the SRv6 L3VPN at runtime
! ("open-dci render" shows the exact lines).
frr defaults datacenter
hostname gw-a
log stdout informational
!
router bgp 4200000016
 bgp router-id 10.0.0.16
 bgp bestpath as-path multipath-relax
 neighbor FABRIC peer-group
 neighbor FABRIC remote-as external
 neighbor FABRIC timers 2 8
 neighbor uplink0 interface peer-group FABRIC
 ! SRv6 transport: exit-a's DCI VRF, IPv6 only
 neighbor uplink1 interface remote-as external
 !
 address-family ipv4 unicast
  network 10.0.0.16/32
  no neighbor uplink1 activate
 exit-address-family
 !
 ! open-dci announces the locator here (transport in the default VRF)
 address-family ipv6 unicast
  neighbor uplink1 activate
 exit-address-family
 !
 ! required for the L3VNIs open-dci provisions
 address-family l2vpn evpn
  neighbor FABRIC activate
  advertise-all-vni
 exit-address-family
exit
!
