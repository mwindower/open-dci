! metal-stack firewall as rendered by metal-networker's frr.firewall.tpl.
! srv6-dci adds its configuration at runtime (see srv6-dci.yaml, and
! "srv6-dci render" for the exact lines).
frr defaults datacenter
hostname fw-b
log stdout informational
!
vrf vrf4011
 vni 4011
exit-vrf
!
router bgp 4200000022
 bgp router-id 10.0.1.12
 bgp bestpath as-path multipath-relax
 neighbor FABRIC peer-group
 neighbor FABRIC remote-as external
 neighbor FABRIC timers 2 8
 neighbor lan0 interface peer-group FABRIC
 !
 address-family ipv4 unicast
  redistribute connected route-map LOOPBACKS
  neighbor FABRIC route-map only-self-out out
 exit-address-family
 !
 address-family ipv6 unicast
  redistribute connected route-map LOOPBACKS
  neighbor FABRIC route-map only-self-out out
  neighbor FABRIC activate
 exit-address-family
 !
 address-family l2vpn evpn
  neighbor FABRIC activate
  advertise-all-vni
 exit-address-family
exit
!
! tenant private network
router bgp 4200000022 vrf vrf4011
 bgp router-id 10.0.1.12
 no bgp enforce-first-as
 bgp bestpath as-path multipath-relax
 !
 address-family ipv4 unicast
  redistribute connected
 exit-address-family
 !
 address-family ipv6 unicast
  redistribute connected
 exit-address-family
 !
 address-family l2vpn evpn
  advertise ipv4 unicast
  advertise ipv6 unicast
 exit-address-family
exit
!
route-map only-self-out permit 10
 match as-path SELF
exit
route-map only-self-out deny 20
exit
!
route-map LOOPBACKS permit 10
 match interface lo
exit
!
bgp as-path access-list SELF seq 5 permit ^$
!
