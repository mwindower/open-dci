frr defaults datacenter
hostname exit-c1
log stdout informational
!
router bgp 4200000034
 bgp router-id 10.0.2.14
 bgp bestpath as-path multipath-relax
 neighbor FABRIC peer-group
 neighbor FABRIC remote-as external
 neighbor FABRIC timers 2 8
 neighbor swp1 interface peer-group FABRIC
 neighbor swp3 interface peer-group FABRIC
 neighbor swp4 interface peer-group FABRIC
 ! core: IPv6 only, carries the gateway locators and exit loopbacks
 neighbor swp2 interface remote-as external
 ! VPN relay between the partitions, a ladder between the exits' loopbacks:
 ! the partitions form a ring, and each exit peers with both exits of the
 ! neighbouring partitions (with three partitions: both other ones). The gateways
 ! (swp3/swp4) send their VPN routes here; the exit passes them on to its
 ! ladder neighbours and to its gateways. Nothing is imported.
 neighbor 2001:db8:e::a1 remote-as 4200000014
 neighbor 2001:db8:e::a1 ebgp-multihop 8
 neighbor 2001:db8:e::a1 update-source 2001:db8:e::c1
 neighbor 2001:db8:e::a1 capability extended-nexthop
 neighbor 2001:db8:e::a2 remote-as 4200000018
 neighbor 2001:db8:e::a2 ebgp-multihop 8
 neighbor 2001:db8:e::a2 update-source 2001:db8:e::c1
 neighbor 2001:db8:e::a2 capability extended-nexthop
 neighbor 2001:db8:e::b1 remote-as 4200000024
 neighbor 2001:db8:e::b1 ebgp-multihop 8
 neighbor 2001:db8:e::b1 update-source 2001:db8:e::c1
 neighbor 2001:db8:e::b1 capability extended-nexthop
 neighbor 2001:db8:e::b2 remote-as 4200000028
 neighbor 2001:db8:e::b2 ebgp-multihop 8
 neighbor 2001:db8:e::b2 update-source 2001:db8:e::c1
 neighbor 2001:db8:e::b2 capability extended-nexthop
 !
 address-family ipv4 unicast
  network 10.0.2.14/32
  no neighbor swp2 activate
  no neighbor 2001:db8:e::a1 activate
  no neighbor 2001:db8:e::a2 activate
  no neighbor 2001:db8:e::b1 activate
  no neighbor 2001:db8:e::b2 activate
 exit-address-family
 !
 ! SRv6 transport in the underlay: partition C's locators out, remote ones in;
 ! plus the exit loopbacks for the VPN sessions between the exits. Only towards
 ! the gateways (swp3/swp4) and the core, never into the fabric (swp1): no
 ! leaf, spine or tenant firewall gets a route to a SID.
 address-family ipv6 unicast
  network 2001:db8:e::c1/128
  neighbor swp2 activate
  neighbor swp3 activate
  neighbor swp4 activate
 exit-address-family
 !
 ! allowas-in: the gateways' VPN routes carry this exit's AS (learned via EVPN
 ! through it)
 address-family ipv4 vpn
  neighbor swp3 activate
  neighbor swp3 allowas-in 1
  neighbor swp4 activate
  neighbor swp4 allowas-in 1
  neighbor 2001:db8:e::a1 activate
  neighbor 2001:db8:e::a2 activate
  neighbor 2001:db8:e::b1 activate
  neighbor 2001:db8:e::b2 activate
 exit-address-family
 !
 ! allowas-in: the gateways' VPN routes carry this exit's AS (learned via EVPN
 ! through it)
 address-family ipv6 vpn
  neighbor swp3 activate
  neighbor swp3 allowas-in 1
  neighbor swp4 activate
  neighbor swp4 allowas-in 1
  neighbor 2001:db8:e::a1 activate
  neighbor 2001:db8:e::a2 activate
  neighbor 2001:db8:e::b1 activate
  neighbor 2001:db8:e::b2 activate
 exit-address-family
 !
 address-family l2vpn evpn
  neighbor FABRIC activate
  neighbor FABRIC allowas-in 2
 exit-address-family
exit
!
