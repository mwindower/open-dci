! modelled after metal-core's sonic_frr.tpl (auto RTs, FIREWALL peer-group, VNI filter)
frr defaults datacenter
hostname leaf-b
log stdout informational
!
vrf vrf4011
 vni 4011
exit-vrf
!
vrf vrf4012
 vni 4012
exit-vrf
!
router bgp 4200000021
 bgp router-id 10.0.1.11
 bgp bestpath as-path multipath-relax
 neighbor FABRIC peer-group
 neighbor FABRIC remote-as external
 neighbor FABRIC timers 2 8
 neighbor swp31 interface peer-group FABRIC
 neighbor FIREWALL peer-group
 neighbor FIREWALL remote-as external
 neighbor FIREWALL timers 2 8
 neighbor swp3 interface peer-group FIREWALL
 !
 address-family ipv4 unicast
  network 10.0.1.11/32
  neighbor FIREWALL allowas-in 2
 exit-address-family
 !
 ! SRv6 transport in the underlay: carries the gateway locators
 address-family ipv6 unicast
  neighbor FABRIC activate
  neighbor FIREWALL activate
  neighbor FIREWALL allowas-in 2
 exit-address-family
 !
 address-family l2vpn evpn
  advertise-all-vni
  neighbor FABRIC activate
  neighbor FABRIC allowas-in 2
  neighbor FIREWALL activate
  neighbor FIREWALL allowas-in 2
  neighbor swp3 route-map fw-swp3-vni out
 exit-address-family
exit
!
! only VNIs the firewall is attached to are sent to it (partition B has no DCI
! network: fw-b's SRv6 transport runs in the IPv6 underlay)
route-map fw-swp3-vni permit 10
 match evpn vni 4011
exit
!
router bgp 4200000021 vrf vrf4011
 bgp router-id 10.0.1.11
 bgp bestpath as-path multipath-relax
 neighbor MACHINE peer-group
 neighbor MACHINE remote-as external
 neighbor MACHINE timers 2 8
 neighbor swp1 interface peer-group MACHINE
 !
 address-family ipv4 unicast
  redistribute connected
 exit-address-family
 !
 address-family ipv6 unicast
  neighbor MACHINE activate
 exit-address-family
 !
 address-family l2vpn evpn
  advertise ipv4 unicast
  advertise ipv6 unicast
 exit-address-family
exit
!
! tenant 2: no firewall attached (the route-map above keeps its VNI away from
! it); stitched by the dedicated gateway gw-b at the exit
router bgp 4200000021 vrf vrf4012
 bgp router-id 10.0.1.11
 bgp bestpath as-path multipath-relax
 neighbor MACHINE peer-group
 neighbor MACHINE remote-as external
 neighbor MACHINE timers 2 8
 neighbor swp2 interface peer-group MACHINE
 !
 address-family ipv4 unicast
  redistribute connected
 exit-address-family
 !
 address-family ipv6 unicast
  neighbor MACHINE activate
 exit-address-family
 !
 address-family l2vpn evpn
  advertise ipv4 unicast
  advertise ipv6 unicast
 exit-address-family
exit
!
