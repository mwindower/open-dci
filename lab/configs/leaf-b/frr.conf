! modelled after metal-core's sonic_frr.tpl (auto RTs, machines per tenant VRF)
frr defaults datacenter
hostname leaf-b
log stdout informational
!
vrf vrf4011
 vni 4011
exit-vrf
!
vrf vrf4012
 vni 4012
exit-vrf
!
router bgp 4200000021
 bgp router-id 10.0.1.11
 bgp bestpath as-path multipath-relax
 neighbor FABRIC peer-group
 neighbor FABRIC remote-as external
 neighbor FABRIC timers 2 8
 neighbor swp31 interface peer-group FABRIC
 !
 address-family ipv4 unicast
  network 10.0.1.11/32
 exit-address-family
 !
 address-family l2vpn evpn
  advertise-all-vni
  neighbor FABRIC activate
  neighbor FABRIC allowas-in 2
 exit-address-family
exit
!
! tenant 1: stitched by the dedicated gateway gw-b at the exit
router bgp 4200000021 vrf vrf4011
 bgp router-id 10.0.1.11
 bgp bestpath as-path multipath-relax
 neighbor MACHINE peer-group
 neighbor MACHINE remote-as external
 neighbor MACHINE timers 2 8
 neighbor swp1 interface peer-group MACHINE
 !
 address-family ipv4 unicast
  redistribute connected
 exit-address-family
 !
 address-family ipv6 unicast
  neighbor MACHINE activate
 exit-address-family
 !
 address-family l2vpn evpn
  advertise ipv4 unicast
  advertise ipv6 unicast
 exit-address-family
exit
!
! tenant 2: stitched by the dedicated gateway gw-b at the exit
router bgp 4200000021 vrf vrf4012
 bgp router-id 10.0.1.11
 bgp bestpath as-path multipath-relax
 neighbor MACHINE peer-group
 neighbor MACHINE remote-as external
 neighbor MACHINE timers 2 8
 neighbor swp2 interface peer-group MACHINE
 !
 address-family ipv4 unicast
  redistribute connected
 exit-address-family
 !
 address-family ipv6 unicast
  neighbor MACHINE activate
 exit-address-family
 !
 address-family l2vpn evpn
  advertise ipv4 unicast
  advertise ipv6 unicast
 exit-address-family
exit
!
