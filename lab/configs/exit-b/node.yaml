# exit of partition B: no DCI network; the SRv6 transport runs in the underlay,
# so the core link (swp2) is in the default VRF. The dedicated gateway gw-b
# hangs off swp3 like any fabric peer.
waitInterfaces: [swp1, swp2, swp3]
loopback: [10.0.1.14/32]
interfaces:
  - {name: swp1, mtu: 9216}
  - {name: swp2, mtu: 9216}
  - {name: swp3, mtu: 9216}
