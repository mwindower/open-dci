frr defaults datacenter
hostname exit-b
log stdout informational
!
router bgp 4200000024
 bgp router-id 10.0.1.14
 bgp bestpath as-path multipath-relax
 neighbor FABRIC peer-group
 neighbor FABRIC remote-as external
 neighbor FABRIC timers 2 8
 neighbor swp1 interface peer-group FABRIC
 neighbor swp3 interface peer-group FABRIC
 neighbor swp4 interface peer-group FABRIC
 ! core: IPv6 only, carries the gateway locators between partitions
 neighbor swp2 interface remote-as external
 ! VPN relay between the partitions (allowas-in: the gateways' VPN routes carry
 ! the exit's own AS, learned via EVPN through it): the gateways (swp3/swp4) and the other
 ! exits (here exit-a, via the core). Nothing is imported.
 neighbor 2001:db8:e::a remote-as 4200000014
 neighbor 2001:db8:e::a ebgp-multihop 8
 neighbor 2001:db8:e::a update-source 2001:db8:e::b
 neighbor 2001:db8:e::a capability extended-nexthop
 !
 address-family ipv4 unicast
  network 10.0.1.14/32
  no neighbor swp2 activate
  no neighbor 2001:db8:e::a activate
 exit-address-family
 !
 ! SRv6 transport in the underlay: partition B's locators out, remote ones in;
 ! plus the exit loopbacks for the VPN sessions between the exits
 address-family ipv6 unicast
  network 2001:db8:e::b/128
  neighbor FABRIC activate
  neighbor swp2 activate
 exit-address-family
 !
 address-family ipv4 vpn
  neighbor swp3 activate
  neighbor swp3 allowas-in 1
  neighbor swp4 activate
  neighbor swp4 allowas-in 1
  neighbor 2001:db8:e::a activate
 exit-address-family
 !
 address-family ipv6 vpn
  neighbor swp3 activate
  neighbor swp3 allowas-in 1
  neighbor swp4 activate
  neighbor swp4 allowas-in 1
  neighbor 2001:db8:e::a activate
 exit-address-family
 !
 address-family l2vpn evpn
  neighbor FABRIC activate
  neighbor FABRIC allowas-in 2
 exit-address-family
exit
!
