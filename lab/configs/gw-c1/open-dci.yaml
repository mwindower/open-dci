# open-dci config of gw-c1: one of the two redundant gateways at exit-c1/exit-c2. Both share
# the locator (anycast) and pin their SIDs. The SRv6 transport runs in the
# default VRF (underlay).
gateway:
  locator: fd00:dc1:c::/48        # shared by gw-c1 and gw-c2 (anycast); SIDs fd00:dc1:c:<sid>::
  loopback: fd00:dc1:ff::c1        # this gateway's own address: SRv6 encap source
  locatorBlock: fd00:dc1::/32     # all gateways' locators and loopbacks
# no transport.vrf: open-dci announces locator and loopback to the default BGP
# instance's IPv6 peers (exit-c1/exit-c2)
peers:                           # the sessions to both exits (base config); the
  - interface: uplink0            # exits relay the VPN routes between the partitions
  - interface: uplink1
networks:
  - vrf: vrf5011                  # created by open-dci (kernel table 5011 = the VNI)
    vni: 5011                     # tenant 1's VNI in partition C (as on leaf-c); SID function = VNI
    routeTarget: "65535:1001"     # the stitched network's global identity
    prefixes:                     # tenant 1's address space in all partitions, same on all gateways
      - 10.0.16.0/24 le 32        #   partition A
      - 10.0.32.0/24 le 32        #   partition B
      - 10.0.48.0/24 le 32        #   partition C
      - 2001:db8:16::/48 le 128
      - 2001:db8:32::/48 le 128
      - 2001:db8:48::/48 le 128
  - vrf: vrf5012
    vni: 5012                     # tenant 2's VNI in partition C
    routeTarget: "65535:1002"
    prefixes:
      - 10.0.17.0/24 le 32
      - 10.0.33.0/24 le 32
      - 10.0.49.0/24 le 32
      - 2001:db8:17::/48 le 128
      - 2001:db8:33::/48 le 128
      - 2001:db8:49::/48 le 128
