# dedicated DCI gateway gw-c1, dual-attached to exit-c1/exit-c2 (one of a redundant pair
# with gw-c2): two uplinks into partition C's fabric, each
# carrying underlay IPv4, EVPN, the VPN routes and the SRv6 transport (IPv6).
waitInterfaces: [uplink0, uplink1]
loopback: [10.0.2.16/32]
interfaces:
  - {name: uplink0, mtu: 9216}
  - {name: uplink1, mtu: 9216}
# open-dci reconciles continuously; --listen serves Prometheus metrics (/metrics)
# and the health (/healthz) on port 9469, --api-listen the gRPC API on 9470, where
# the core's dci-controller sets tenant 2 (plaintext on the lab's management network)
sidecars:
  - [/usr/local/bin/open-dci, run, -c, /etc/open-dci/config.yaml, --listen, ":9469",
     --api-listen, ":9470", --api-token-file, /etc/open-dci/api-token]
