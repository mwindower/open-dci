# metal-stack firewall as metal-networker sets it up: one VLAN-aware bridge,
# vni<VNI>/vlan<VNI>/vrf<VNI> per network, everything at MTU 9000, uplink 9216.
#   vrf3981  tenant private network
#   vrf104100  DCI network (a metal-stack network attached to the firewall)
# Everything DCI-specific (loopback, veth, MTU, ip rules, FRR additions) is
# added at runtime by the srv6-dci sidecar.
waitInterfaces: [lan0]
loopback: [10.0.0.12/32]
vrfs:
  - {name: vrf3981, table: 1000}
  - {name: vrf104100, table: 1001}
bridge: {name: bridge, mtu: 9000}
vnis:
  - {vni: 3981, vlan: 1000, vrf: vrf3981, local: 10.0.0.12, mtu: 9000, sviAddresses: [10.0.16.2/32, "2001:db8:16::2/128"]}
  - {vni: 104100, vlan: 1001, vrf: vrf104100, local: 10.0.0.12, mtu: 9000}
interfaces:
  - {name: lan0, mtu: 9216}
sidecars:
  - [/usr/local/bin/srv6-dci, run, -c, /etc/srv6-dci/config.yaml]
