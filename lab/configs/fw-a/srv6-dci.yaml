# srv6-dci config of fw-a (transport in a DCI network). ASN and router-id are
# discovered from the running FRR.
gateway:
  locator: fd00:dc1:a::/48        # loopback fd00:dc1:a::1, End.DT46 SIDs fd00:dc1:a:<n>::
  locatorBlock: fd00:dc1::/32     # all gateways' locators
transport:
  vrf: vrf104100                  # DCI network (metal-stack network) carrying the SRv6 transport
peers:
  - {address: "fd00:dc1:b::1", asn: 4200000022}   # fw-b
networks:
  - vrf: vrf3981                   # tenant private network of partition A
    routeTarget: "65535:1001"     # the stitched network's global identity
