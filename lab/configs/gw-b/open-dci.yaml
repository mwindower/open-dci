# open-dci config of gw-b: a dedicated gateway at exit-b that provisions the
# tenant VRFs itself. The SRv6 transport runs in the default VRF (underlay).
gateway:
  locator: fd00:dc1:b::/48        # loopback fd00:dc1:b::1, End.DT46 SIDs fd00:dc1:b:<n>::
  locatorBlock: fd00:dc1::/32     # all gateways' locators
# no transport.vrf: open-dci announces the locator to the default BGP
# instance's IPv6 peers (exit-b)
peers:
  - {address: "fd00:dc1:a::1", asn: 4200000016}   # gw-a
networks:
  - vrf: vrf4011                  # created by open-dci (kernel table 4011 = the VNI)
    vni: 4011                     # tenant 1's VNI in partition B (as on leaf-b)
    routeTarget: "65535:1001"
  - vrf: vrf4012
    vni: 4012                     # tenant 2's VNI in partition B
    routeTarget: "65535:1002"
