frr defaults datacenter
hostname exit-a2
log stdout informational
!
! BFD: detects a neighbour that stops forwarding while its link stays up
! (hung node, one-way link) in 3 x 300 ms instead of the 8-9 s hold time
bfd
 profile dci
  transmit-interval 300
  receive-interval 300
  detect-multiplier 3
 exit
exit
!
vrf vrf104100
 vni 104100
exit-vrf
!
router bgp 4200000018
 bgp router-id 10.0.0.18
 bgp bestpath as-path multipath-relax
 neighbor FABRIC peer-group
 neighbor FABRIC remote-as external
 neighbor FABRIC timers 2 8
 neighbor swp1 interface peer-group FABRIC
 neighbor swp1 bfd profile dci
 neighbor swp3 interface peer-group FABRIC
 neighbor swp3 bfd profile dci
 neighbor swp4 interface peer-group FABRIC
 neighbor swp4 bfd profile dci
 ! default-VRF link to the core: carries the exit loopbacks
 neighbor swp5 interface remote-as external
 neighbor swp5 bfd profile dci
 ! VPN relay between the partitions, a ladder between the exits' loopbacks:
 ! the partitions form a ring, and each exit peers with both exits of the
 ! neighbouring partitions (with three partitions: both other ones). The gateways
 ! (swp3/swp4) send their VPN routes here; the exit passes them on to its
 ! ladder neighbours and to its gateways. Nothing is imported.
 neighbor 2001:db8:e::b1 remote-as 4200000024
 neighbor 2001:db8:e::b1 ebgp-multihop 8
 neighbor 2001:db8:e::b1 update-source 2001:db8:e::a2
 neighbor 2001:db8:e::b1 capability extended-nexthop
 neighbor 2001:db8:e::b2 remote-as 4200000028
 neighbor 2001:db8:e::b2 ebgp-multihop 8
 neighbor 2001:db8:e::b2 update-source 2001:db8:e::a2
 neighbor 2001:db8:e::b2 capability extended-nexthop
 neighbor 2001:db8:e::c1 remote-as 4200000034
 neighbor 2001:db8:e::c1 ebgp-multihop 8
 neighbor 2001:db8:e::c1 update-source 2001:db8:e::a2
 neighbor 2001:db8:e::c1 capability extended-nexthop
 neighbor 2001:db8:e::c2 remote-as 4200000038
 neighbor 2001:db8:e::c2 ebgp-multihop 8
 neighbor 2001:db8:e::c2 update-source 2001:db8:e::a2
 neighbor 2001:db8:e::c2 capability extended-nexthop
 !
 address-family ipv4 unicast
  network 10.0.0.18/32
  no neighbor swp5 activate
  no neighbor 2001:db8:e::b1 activate
  no neighbor 2001:db8:e::b2 activate
  no neighbor 2001:db8:e::c1 activate
  no neighbor 2001:db8:e::c2 activate
 exit-address-family
 !
 ! the exit loopbacks, for the VPN sessions between the exits
 address-family ipv6 unicast
  network 2001:db8:e::a2/128
  neighbor swp5 activate
 exit-address-family
 !
 ! allowas-in: the gateways' VPN routes carry this exit's AS (learned via EVPN
 ! through it)
 address-family ipv4 vpn
  neighbor swp3 activate
  neighbor swp3 allowas-in 1
  neighbor swp4 activate
  neighbor swp4 allowas-in 1
  neighbor 2001:db8:e::b1 activate
  neighbor 2001:db8:e::b2 activate
  neighbor 2001:db8:e::c1 activate
  neighbor 2001:db8:e::c2 activate
 exit-address-family
 !
 ! allowas-in: the gateways' VPN routes carry this exit's AS (learned via EVPN
 ! through it)
 address-family ipv6 vpn
  neighbor swp3 activate
  neighbor swp3 allowas-in 1
  neighbor swp4 activate
  neighbor swp4 allowas-in 1
  neighbor 2001:db8:e::b1 activate
  neighbor 2001:db8:e::b2 activate
  neighbor 2001:db8:e::c1 activate
  neighbor 2001:db8:e::c2 activate
 exit-address-family
 !
 address-family l2vpn evpn
  neighbor FABRIC activate
  neighbor FABRIC allowas-in 2
  advertise-all-vni
 exit-address-family
exit
!
! DCI network: EVPN towards the partition, plain IPv6 towards the core
router bgp 4200000018 vrf vrf104100
 bgp router-id 10.0.0.18
 no bgp enforce-first-as
 bgp bestpath as-path multipath-relax
 neighbor swp2 interface remote-as external
 neighbor swp2 bfd profile dci
 !
 address-family ipv4 unicast
  no neighbor swp2 activate
 exit-address-family
 !
 address-family ipv6 unicast
  neighbor swp2 activate
 exit-address-family
 !
 address-family l2vpn evpn
  advertise ipv6 unicast
 exit-address-family
exit
!
