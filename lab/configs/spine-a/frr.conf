frr defaults datacenter
hostname spine-a
log stdout informational
!
! BFD: detects a neighbour that stops forwarding while its link stays up
! (hung node, one-way link) in 3 x 300 ms instead of the 8-9 s hold time
bfd
 profile dci
  transmit-interval 300
  receive-interval 300
  detect-multiplier 3
 exit
exit
!
router bgp 4200000013
 bgp router-id 10.0.0.13
 bgp bestpath as-path multipath-relax
 neighbor FABRIC peer-group
 neighbor FABRIC remote-as external
 neighbor FABRIC timers 2 8
 neighbor swp1 interface peer-group FABRIC
 neighbor swp2 interface peer-group FABRIC
 neighbor swp2 bfd profile dci
 neighbor swp3 interface peer-group FABRIC
 neighbor swp3 bfd profile dci
 !
 address-family ipv4 unicast
  network 10.0.0.13/32
 exit-address-family
 !
 address-family l2vpn evpn
  neighbor FABRIC activate
  neighbor FABRIC allowas-in 2
 exit-address-family
exit
!
