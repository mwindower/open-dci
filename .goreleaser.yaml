# Release: push a tag vX.Y.Z; .github/workflows/release.yaml runs goreleaser.
version: 2
project_name: open-dci

builds:
  - main: ./cmd/open-dci
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{ .Version }}"]

archives:
  - formats: [tar.gz]
    files: [LICENSE, README.md, deploy/systemd/open-dci.service]

checksum:
  name_template: checksums.txt

dockers:
  - image_templates: ["ghcr.io/{{ .Env.GITHUB_REPOSITORY_OWNER }}/open-dci:{{ .Version }}-amd64"]
    dockerfile: Dockerfile
    use: buildx
    build_flag_templates: [--platform=linux/amd64]
  - image_templates: ["ghcr.io/{{ .Env.GITHUB_REPOSITORY_OWNER }}/open-dci:{{ .Version }}-arm64"]
    dockerfile: Dockerfile
    use: buildx
    goarch: arm64
    build_flag_templates: [--platform=linux/arm64]

docker_manifests:
  - name_template: "ghcr.io/{{ .Env.GITHUB_REPOSITORY_OWNER }}/open-dci:{{ .Version }}"
    image_templates:
      - "ghcr.io/{{ .Env.GITHUB_REPOSITORY_OWNER }}/open-dci:{{ .Version }}-amd64"
      - "ghcr.io/{{ .Env.GITHUB_REPOSITORY_OWNER }}/open-dci:{{ .Version }}-arm64"
  - name_template: "ghcr.io/{{ .Env.GITHUB_REPOSITORY_OWNER }}/open-dci:latest"
    image_templates:
      - "ghcr.io/{{ .Env.GITHUB_REPOSITORY_OWNER }}/open-dci:{{ .Version }}-amd64"
      - "ghcr.io/{{ .Env.GITHUB_REPOSITORY_OWNER }}/open-dci:{{ .Version }}-arm64"

changelog:
  sort: asc
  filters:
    exclude: ["^docs:", "^test:", "^ci:"]
