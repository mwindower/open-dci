<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 410" width="960" height="410" role="img" aria-label="Animated packet flow across three partitions joined by the DCI network, an IPv6-only core. Each partition shows its two exits, its redundant gateway pair (attached to both exits) and its fabric (spines, leaves, machines) as one box each. A tenant packet comes from partition A's fabric over VXLAN with VNI 3981 via either exit to either gateway of pair A, which provisioned the tenant VRF. The gateway encapsulates it in SRv6 to partition B's anycast SID and sends it in partition A's EVPN VRF for the transport (VNI 104100) to either exit, into the DCI network. Partition B's exits deliver it to either gateway of pair B, which decapsulates it (End.DT46) and forwards it with partition B's VNI 4011 via the exits into partition B's fabric. Partition C works alike.">
<style>
  text { font-family: ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
  .scene { font-size: 13px; font-weight: 600; }
  .part { fill: #f6f8fa; stroke: #d0d7de; }
  .plabel { font-size: 12px; font-weight: 600; fill: #59636e; }
  .link { stroke: #8c959f; stroke-width: 2; }
  .node { fill: #ffffff; stroke: #59636e; stroke-width: 1.5; }
  .gw { fill: #fff1e5; stroke: #bc4c00; stroke-width: 2; }
  .fab { stroke-dasharray: 5 4; }
  .nl { font-size: 12px; font-weight: 600; }
  .ns { font-size: 10px; fill: #59636e; }
  .h { stroke: rgba(0,0,0,.25); }
  .ip { fill: #dafbe1; } .vx { fill: #ddf4ff; } .dci { fill: #eddeff; } .sr { fill: #ffe2cc; }
  .ht { font-size: 10.5px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .cap { font-size: 13px; }
  .pkt { fill: #bc4c00; }
  @media (prefers-color-scheme: dark) {
    text { fill: #e6edf3; }
    .part { fill: #161b22; stroke: #3d444d; }
    .plabel, .ns { fill: #9198a1; }
    .link { stroke: #656c76; }
    .node { fill: #0d1117; stroke: #9198a1; }
    .gw { fill: #3d1d00; stroke: #f0883e; }
    .h { stroke: rgba(255,255,255,.2); }
    .ht { fill: #0d1117; }
    .pkt { fill: #f0883e; }
  }
</style>
<rect class="part" x="8" y="165" width="304" height="207" rx="10"/><text class="plabel" x="160" y="345" text-anchor="middle">Partition A</text><text class="ns" x="160" y="360" text-anchor="middle">locator fd00:dc1:a::/48 · transport: EVPN VRF</text>
<rect class="part" x="328" y="165" width="304" height="207" rx="10"/><text class="plabel" x="480" y="345" text-anchor="middle">Partition B</text><text class="ns" x="480" y="360" text-anchor="middle">locator fd00:dc1:b::/48 · transport: underlay</text>
<rect class="part" x="648" y="165" width="304" height="207" rx="10"/><text class="plabel" x="800" y="345" text-anchor="middle">Partition C</text><text class="ns" x="800" y="360" text-anchor="middle">locator fd00:dc1:c::/48 · transport: underlay</text>
<line class="link" x1="480" y1="125" x2="160" y2="215"/>
<line class="link" x1="160" y1="215" x2="85" y2="295"/>
<line class="link" x1="160" y1="215" x2="235" y2="295"/>
<line class="link" x1="480" y1="125" x2="480" y2="215"/>
<line class="link" x1="480" y1="215" x2="405" y2="295"/>
<line class="link" x1="480" y1="215" x2="555" y2="295"/>
<line class="link" x1="480" y1="125" x2="800" y2="215"/>
<line class="link" x1="800" y1="215" x2="725" y2="295"/>
<line class="link" x1="800" y1="215" x2="875" y2="295"/>
<rect class="node" x="390.0" y="110.0" width="180" height="30" rx="6"/><text class="nl" x="480" y="129" text-anchor="middle">DCI network · IPv6 only</text>
<rect class="node" x="90.0" y="200.0" width="140" height="30" rx="6"/><text class="nl" x="160" y="219" text-anchor="middle">exit-a1 · exit-a2</text>
<rect class="node fab" x="25.0" y="280.0" width="120" height="30" rx="6"/><text class="nl" x="85" y="299" text-anchor="middle">fabric</text>
<text class="ns" x="85" y="322" text-anchor="middle">spines · leaves · machines</text>
<rect class="node gw" x="175.0" y="280.0" width="120" height="30" rx="6"/><text class="nl" x="235" y="299" text-anchor="middle">gw-a1 · gw-a2</text>
<text class="ns" x="235" y="322" text-anchor="middle">anycast pair</text>
<rect class="node" x="410.0" y="200.0" width="140" height="30" rx="6"/><text class="nl" x="480" y="219" text-anchor="middle">exit-b1 · exit-b2</text>
<rect class="node fab" x="345.0" y="280.0" width="120" height="30" rx="6"/><text class="nl" x="405" y="299" text-anchor="middle">fabric</text>
<text class="ns" x="405" y="322" text-anchor="middle">spines · leaves · machines</text>
<rect class="node gw" x="495.0" y="280.0" width="120" height="30" rx="6"/><text class="nl" x="555" y="299" text-anchor="middle">gw-b1 · gw-b2</text>
<text class="ns" x="555" y="322" text-anchor="middle">anycast pair</text>
<rect class="node" x="730.0" y="200.0" width="140" height="30" rx="6"/><text class="nl" x="800" y="219" text-anchor="middle">exit-c1 · exit-c2</text>
<rect class="node fab" x="665.0" y="280.0" width="120" height="30" rx="6"/><text class="nl" x="725" y="299" text-anchor="middle">fabric</text>
<text class="ns" x="725" y="322" text-anchor="middle">spines · leaves · machines</text>
<rect class="node gw" x="815.0" y="280.0" width="120" height="30" rx="6"/><text class="nl" x="875" y="299" text-anchor="middle">gw-c1 · gw-c2</text>
<text class="ns" x="875" y="322" text-anchor="middle">anycast pair</text>
<text class="scene" x="480" y="26" text-anchor="middle">Tenant VRFs stitched across the DCI network by redundant gateway pairs</text>
<g opacity="1"><animate attributeName="opacity" dur="13.2s" repeatCount="indefinite" calcMode="discrete" values="1;0" keyTimes="0;0.1818"/><rect class="h ip" x="345" y="80" width="270" height="16" rx="3"/><text class="ht" x="480" y="92" text-anchor="middle">IPv4  10.0.16.10 → 10.0.32.10</text><rect class="h vx" x="345" y="62" width="270" height="16" rx="3"/><text class="ht" x="480" y="74" text-anchor="middle">VXLAN  VNI 3981 (tenant 1, A)</text></g>
<g opacity="0"><animate attributeName="opacity" dur="13.2s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.1818;0.3636"/><rect class="h ip" x="345" y="80" width="270" height="16" rx="3"/><text class="ht" x="480" y="92" text-anchor="middle">IPv4  10.0.16.10 → 10.0.32.10</text><rect class="h sr" x="345" y="62" width="270" height="16" rx="3"/><text class="ht" x="480" y="74" text-anchor="middle">SRv6  → fd00:dc1:b:fab:: (End.DT46)</text><rect class="h dci" x="345" y="44" width="270" height="16" rx="3"/><text class="ht" x="480" y="56" text-anchor="middle">VXLAN  VNI 104100 (DCI VRF)</text></g>
<g opacity="0"><animate attributeName="opacity" dur="13.2s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.3636;0.5455"/><rect class="h ip" x="345" y="80" width="270" height="16" rx="3"/><text class="ht" x="480" y="92" text-anchor="middle">IPv4  10.0.16.10 → 10.0.32.10</text><rect class="h sr" x="345" y="62" width="270" height="16" rx="3"/><text class="ht" x="480" y="74" text-anchor="middle">SRv6  → fd00:dc1:b:fab::</text></g>
<g opacity="0"><animate attributeName="opacity" dur="13.2s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.5455;0.7273"/><rect class="h ip" x="345" y="80" width="270" height="16" rx="3"/><text class="ht" x="480" y="92" text-anchor="middle">IPv4  10.0.16.10 → 10.0.32.10</text><rect class="h sr" x="345" y="62" width="270" height="16" rx="3"/><text class="ht" x="480" y="74" text-anchor="middle">SRv6  → fd00:dc1:b:fab::</text></g>
<g opacity="0"><animate attributeName="opacity" dur="13.2s" repeatCount="indefinite" calcMode="discrete" values="0;1" keyTimes="0;0.7273"/><rect class="h ip" x="345" y="80" width="270" height="16" rx="3"/><text class="ht" x="480" y="92" text-anchor="middle">IPv4  10.0.16.10 → 10.0.32.10</text><rect class="h vx" x="345" y="62" width="270" height="16" rx="3"/><text class="ht" x="480" y="74" text-anchor="middle">VXLAN  VNI 4011 (tenant 1, B)</text></g>
<g><animateTransform attributeName="transform" type="translate" dur="13.2s" repeatCount="indefinite" values="85 269;160 189;235 269;235 269;235 269;160 189;160 189;160 189;480 99;480 189;480 189;480 189;555 269;555 269;555 269;480 189;405 269;405 269" keyTimes="0.0000;0.0492;0.0985;0.1818;0.1818;0.2803;0.3636;0.3636;0.4411;0.4621;0.5455;0.5455;0.6439;0.7273;0.7273;0.7765;0.8258;1.0000"/><circle class="pkt" cx="0" cy="0" r="6"/></g>
<g opacity="1"><animate attributeName="opacity" dur="13.2s" repeatCount="indefinite" calcMode="discrete" values="1;0" keyTimes="0;0.1818"/><text class="cap" x="480" y="398" text-anchor="middle"><tspan font-weight="600">1/5  fabric A → gateways A:</tspan> EVPN type-5 via either exit to either gateway (ECMP): both are VTEPs of VNI 3981.</text></g>
<g opacity="0"><animate attributeName="opacity" dur="13.2s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.1818;0.3636"/><text class="cap" x="480" y="398" text-anchor="middle"><tspan font-weight="600">2/5  gateways A → exits A:</tspan> SRv6 to B's anycast SID, in A's EVPN VRF for the transport, to either exit.</text></g>
<g opacity="0"><animate attributeName="opacity" dur="13.2s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.3636;0.5455"/><text class="cap" x="480" y="398" text-anchor="middle"><tspan font-weight="600">3/5  exits A → exits B:</tspan> The DCI network is plain IPv6: locators, no tenants, no VNIs. C works alike.</text></g>
<g opacity="0"><animate attributeName="opacity" dur="13.2s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.5455;0.7273"/><text class="cap" x="480" y="398" text-anchor="middle"><tspan font-weight="600">4/5  exits B → gateways B:</tspan> Both gateways own the SID; either one, or either exit, may fail.</text></g>
<g opacity="0"><animate attributeName="opacity" dur="13.2s" repeatCount="indefinite" calcMode="discrete" values="0;1" keyTimes="0;0.7273"/><text class="cap" x="480" y="398" text-anchor="middle"><tspan font-weight="600">5/5  gateways B → fabric B:</tspan> End.DT46 into the tenant VRF, type-5 with B's own VNI 4011. Tenants never see SIDs.</text></g>
</svg>
